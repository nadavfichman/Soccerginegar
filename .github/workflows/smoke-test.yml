name: Smoke test

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch: {}
  # מוניטור יומי אמיתי ל-production-canary (לא רק בדיקת regression על
  # push) — אם Vercel/הדומיין ייפלו באופן עצמאי בלי שום שינוי קוד, זה
  # ייתפס תוך 24 שעות במקום לחכות ל-push הבא. ה-job smoke לא רץ בטריגר
  # הזה (ר' ה-if שלו למטה) כדי לא לבזבז דקות CI מיותרות על e2e מלא כל יום.
  schedule:
    - cron: "0 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run CHECKLIST.md automated checks (syntax, RLS bypass, manifest)
        run: npm run check

      - name: Run unit tests (fast, no browser needed)
        run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      - name: Serve the site locally
        run: |
          python3 -m http.server 8080 &
          sleep 1

      - name: Run e2e smoke tests
        run: npm run test:e2e
        env:
          SITE_URL: http://localhost:8080/

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # רץ אחרי כל מיזוג ל-main (אז ל-Vercel יש מה לפרוס) וגם על לוח זמנים
  # יומי (ר' schedule למעלה) — מוודא שה-APP_URL שמוטבע בפועל בקוד (הקישור
  # שנשלח לשחקנים בהודעות וואטסאפ) באמת עולה ומגיש את האפליקציה האמיתית.
  # זה בדיוק מה שהיה תופס אוטומטית את הפעמים שה-APP_URL הצביע לכתובת
  # שגויה (ר' CLAUDE.md "באגים משמעותיים" #5), בלי לחכות ששחקן ילחץ על
  # קישור שבור וידווח — והטריגר היומי תופס גם תקלה שקרתה בלי שום push
  # (למשל Vercel/הדומיין נפלו מסיבות שלהם).
  production-canary:
    name: Verify production APP_URL is live
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Extract APP_URL from index.html
        id: appurl
        run: |
          URL=$(grep -oP 'const APP_URL = "\K[^"]+' index.html)
          if [ -z "$URL" ]; then
            echo "לא נמצא APP_URL ב-index.html"
            exit 1
          fi
          echo "בודק: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel deploy and verify the real app is served
        run: |
          URL="${{ steps.appurl.outputs.url }}"
          for i in $(seq 1 10); do
            STATUS=$(curl -sL -o /tmp/body.html -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ] && grep -q "כדורגל גניגרי ושות" /tmp/body.html; then
              echo "תקין: $URL עובד ומגיש את האפליקציה (ניסיון $i)"
              exit 0
            fi
            echo "ניסיון $i: סטטוס $STATUS, מנסה שוב בעוד 15 שניות..."
            sleep 15
          done
          echo "כשל: $URL לא הגיש את האפליקציה האמיתית אחרי כל הניסיונות (סטטוס אחרון: $STATUS)"
          exit 1
