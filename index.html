const { useState, useEffect, useRef } = React;

// ==== חיבור ל-Supabase ====
const APP_URL = "https://ginegarsoccer-29826.vercel.app/index.html";
const SUPABASE_URL = "https://unjlkvszqdigyfxwnmot.supabase.co";
const SUPABASE_KEY = "sb_publishable_Az_gUJnuPo61SJ9VTq8VTg_vHPWNk1y";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MAX_PLAYERS = 22;

// עזרי זמן, ולידציה, זיהוי כפילויות ומיון עדיפות — מקור אמת יחיד ב-logic.js
// (גם tests/logic.spec.js טוען את אותו קובץ, כדי שהבדיקות תמיד יבדקו בדיוק
// את הקוד שרץ כאן, לא עותק נפרד).
const {
  fmt, fmtDateTime, fmtTime, dateOnly, dayName, countdown,
  normPhone, validName, normName, validPhone, normEmail, validEmail, sameEmail,
  findDuplicate, tierRank, sortRegs, splitTeamsByGrade,
} = AppLogic;

// שולח רשומת שגיאה ל-Supabase (best effort — לא זורק, לא חוסם את המשתמש) כדי
// שנדע שקרתה תקלה בלי לחכות שמישהו ידווח עליה ידנית. ר' log_client_error ב-
// supabase/functions.sql.
function logClientError(message, stack, context) {
  try {
    db.rpc("log_client_error", {
      p_message: String(message || "").slice(0, 2000),
      p_stack: String(stack || "").slice(0, 4000),
      p_user_agent: (navigator.userAgent || "").slice(0, 500),
      p_url: (window.location.href || "").slice(0, 500),
      p_context: String(context || "").slice(0, 200),
    }).then(({ error }) => { if (error) console.error("logClientError failed", error); });
  } catch (e) { console.error("logClientError threw", e); }
}
window.addEventListener("error", (e) => logClientError(e.message, e.error && e.error.stack, "window.onerror"));
window.addEventListener("unhandledrejection", (e) => logClientError(e.reason && e.reason.message || String(e.reason), e.reason && e.reason.stack, "unhandledrejection"));

// קריאת RPC ניהולית עם חשיפת שגיאות — כדי שכישלון בשרת (למשל אישורים שפגו
// אחרי מעבר בין מסך שחקן לניהול) לא ייבלע בשקט ויראה כאילו "כלום לא קרה".
async function callAdmin(rpcName, args) {
  const { data, error } = await db.rpc(rpcName, args);
  if (error) {
    console.error(rpcName, error);
    logClientError(error.message, error.details, "callAdmin:" + rpcName);
    window.alert("הפעולה נכשלה — ייתכן שההתחברות לניהול פגה. נסה לצאת ולהתחבר שוב.");
  }
  return data;
}

// עוטף את כל האפליקציה כדי שקריסת רינדור (שגיאה לא צפויה בקומפוננטה) תציג
// הודעה ידידותית במקום מסך לבן ריק, ותשלח רשומה ל-log_client_error כדי
// שנדע שזה קרה בלי לחכות שהמשתמש ידווח.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, info) {
    logClientError(error && error.message, error && error.stack, "ErrorBoundary:" + ((info && info.componentStack) || "").slice(0, 150));
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={S.errorBox}>
          <h2 style={S.centerTitle}>משהו השתבש</h2>
          <p style={S.centerText}>אירעה תקלה לא צפויה. נסה לרענן את הדף.</p>
          <button className="btn primary" onClick={() => window.location.reload()}>רענן</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ==== שכבת גישה לנתונים ====
const api = {
  async loadAll() {
    const [players, preqs, admins, areqs, games, regs, declines] = await Promise.all([
      db.from("players").select("*"),
      db.from("player_requests").select("*"),
      db.from("admins").select("*"),
      db.from("admin_requests").select("*"),
      db.from("games").select("*"),
      db.from("registrations").select("id, game_id, player_id, ts, attended, guest_name"),
      db.from("game_declines").select("game_id, player_id, ts"),
    ]);
    return {
      roster: players.data || [],
      pending: preqs.data || [],
      admins: admins.data || [],
      adminReqs: areqs.data || [],
      games: games.data || [],
      regs: regs.data || [],
      declines: declines.data || [],
    };
  },
  // בדיקת תפקיד — מוגן, לא חושף שום סוד. אף תפקיד לא ניתן לפי טלפון בלבד.
  async checkLogin(pw, phone, pin) {
    const { data, error } = await db.rpc("check_login", { input_pw: pw || null, input_phone: phone || null, input_pin: pin || null });
    if (error) { console.error(error); return null; }
    return data; // 'super' | 'admin' | null
  },
  // רמז בלבד לממשק (איזה שדה להציג) — לא מעניק שום הרשאה בעצמו
  async loginHint(phone) {
    if (!phone) return null;
    const { data, error } = await db.rpc("login_hint", { input_phone: phone });
    if (error) { console.error(error); return null; }
    return data; // 'super' | 'admin' | null
  },
  // עדכון הגדרות — דורש גם את סיסמת האדמין-על הנוכחית וגם אימות מייל אמיתי (ר' update_settings_secure)
  async updateSettings(currentSuperPw, newSuperPw, newSuperPhone) {
    const { data, error } = await db.rpc("update_settings_secure", {
      current_super_pw: currentSuperPw, new_super_pw: newSuperPw, new_super_phone: newSuperPhone || null,
    });
    if (error) { console.error(error); return false; }
    return data === true;
  },
  async createInvite(currentSuperPw, targetPhone) {
    const { data, error } = await db.rpc("create_admin_invite", { current_super_pw: currentSuperPw, target_phone: targetPhone });
    if (error) { console.error(error); return { ok:false, error: error.message }; }
    return { ok:true, code: data };
  },
  async listInvites(currentSuperPw) {
    const { data, error } = await db.rpc("list_pending_invites", { current_super_pw: currentSuperPw });
    if (error) { console.error(error); return { ok:false, error: error.message }; }
    return { ok:true, invites: data || [] };
  },
  async cancelInvite(currentSuperPw, inviteId) {
    const { data, error } = await db.rpc("cancel_admin_invite", { current_super_pw: currentSuperPw, invite_id: inviteId });
    if (error) { console.error(error); return false; }
    return data === true;
  },
  async redeemInvite(phone, code, pin) {
    const { data, error } = await db.rpc("redeem_admin_invite", { input_phone: phone, input_code: code, input_pin: pin });
    if (error) { console.error(error); return "error"; }
    return data; // 'ok' | 'not_a_player' | 'invalid_code' | 'already_admin' | 'pin_too_short'
  },
  async createPinReset(currentSuperPw, targetPhone) {
    const { data, error } = await db.rpc("create_pin_reset", { current_super_pw: currentSuperPw, target_phone: targetPhone });
    if (error) { console.error(error); return { ok:false }; }
    return { ok:true, code: data };
  },
  async listPinResets(currentSuperPw) {
    const { data, error } = await db.rpc("list_pending_resets", { current_super_pw: currentSuperPw });
    if (error) { console.error(error); return { ok:false, resets: [] }; }
    return { ok:true, resets: data || [] };
  },
  async cancelPinReset(currentSuperPw, resetId) {
    const { data, error } = await db.rpc("cancel_pin_reset", { current_super_pw: currentSuperPw, reset_id: resetId });
    if (error) { console.error(error); return false; }
    return data === true;
  },
  async redeemPinReset(phone, code, pin) {
    const { data, error } = await db.rpc("redeem_pin_reset", { input_phone: phone, input_code: code, input_pin: pin });
    if (error) { console.error(error); return "error"; }
    return data; // 'ok' | 'not_admin' | 'invalid_code' | 'pin_too_short'
  },
};

// ============================================================================
function App() {
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");
  const [now, setNow] = useState(Date.now());
  const [view, setView] = useState("player");
  const [role, setRole] = useState(null);
  // האישורים שאומתו בכניסה לניהול — ברמת App כדי לשרוד מעבר בין מסך שחקן/ניהול
  // (AdminView נטענת מחדש בכל מעבר כזה, ואיתה כל ה-state המקומי שלה היה מתאפס).
  const [cred, setCred] = useState(null);

  const [roster, setRoster] = useState([]);
  const [pending, setPending] = useState([]);
  const [admins, setAdmins] = useState([]);
  const [adminReqs, setAdminReqs] = useState([]);
  const [games, setGames] = useState([]);
  const [regs, setRegs] = useState([]);
  const [declines, setDeclines] = useState([]);

  // ==== זהות אמיתית של השחקן — Supabase Auth (אימות מייל) ====
  const [session, setSession] = useState(null);
  const [identity, setIdentity] = useState(null); // { status, player_id, name, phone, is_ganigari, is_vatik } | null
  const [identityLoaded, setIdentityLoaded] = useState(false);
  const myPhone = identity ? identity.phone : null; // נגזר מהזהות המאומתת, לרמז ניהול בלבד

  // קישור אימות שפג/נוצל כבר (למשל אימייל שסרק אותו אוטומטית לפני שהמשתמש
  // לחץ, תופעה נפוצה ב-Gmail) גורם ל-Supabase להפנות חזרה עם שגיאה ב-URL
  // (#error=...) בלי ליצור session — בלי הטיפול הזה, המשתמש פשוט חוזר למסך
  // ההצטרפות הריק שוב ושוב, בלי שום הסבר למה (נראה כאילו "כלום לא קורה").
  const [authError, setAuthError] = useState("");
  useEffect(() => {
    const hash = window.location.hash || "";
    if (hash.includes("error=")) {
      const params = new URLSearchParams(hash.replace(/^#/, ""));
      const desc = (params.get("error_description") || params.get("error_code") || params.get("error") || "").replace(/\+/g, " ");
      setAuthError(desc || "אימות נכשל");
      logClientError(desc || "auth redirect error", "", "magic-link-redirect");
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }
  }, []);

  const loadIdentity = async () => {
    const { data: { session: s } } = await db.auth.getSession();
    setSession(s);
    if (s) {
      const { data, error } = await db.rpc("get_my_identity");
      if (error) console.error("get_my_identity failed:", error);
      setIdentity(data && data[0] ? data[0] : null);
    } else {
      setIdentity(null);
    }
    setIdentityLoaded(true);
  };

  useEffect(() => {
    loadIdentity();
    const { data: sub } = db.auth.onAuthStateChange((_event, s) => {
      setSession(s);
      loadIdentity();
    });
    return () => { sub && sub.subscription && sub.subscription.unsubscribe(); };
  }, []);

  const refresh = async () => {
    try {
      const d = await api.loadAll();
      setRoster(d.roster); setPending(d.pending); setAdmins(d.admins);
      setAdminReqs(d.adminReqs); setGames(d.games); setRegs(d.regs); setDeclines(d.declines);
      setErr("");
    } catch(e){ setErr("בעיה בחיבור לשרת. בדוק חיבור אינטרנט."); console.error(e); }
    setLoaded(true);
  };

  useEffect(() => { refresh(); }, []);
  // רענון אוטומטי כל 5 שניות כדי לסנכרן בין מכשירים
  useEffect(() => { const t = setInterval(refresh, 5000); return () => clearInterval(t); }, []);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  // בונה מבנה game עם registrations מקוננות (כמו הגרסה הישנה)
  const gamesWithRegs = games.map(g => ({
    id: g.id, kickoff: g.kickoff, opensAt: g.opens_at,
    published: g.published, rosterPublished: g.roster_published, attendanceLocked: !!g.attendance_locked,
    visibleToPrimary: !!g.visible_to_primary, visibleToSecondary: !!g.visible_to_secondary,
    registrationClosed: !!g.registration_closed,
    registrations: regs.filter(r => r.game_id === g.id).map(r => ({ playerId: r.player_id, ts: r.ts, attended: !!r.attended, guestName: r.guest_name || null })),
    declines: declines.filter(d => d.game_id === g.id).map(d => ({ playerId: d.player_id, ts: d.ts })),
  }));

  // ספירת הגעות מצטברת לכל שחקן — נספרת רק ממשחקים שננעלו. כל עוד משחק פתוח,
  // הסימונים בו ניתנים לשינוי חופשי ולא משפיעים על העדיפות; נעילה "צורבת" אותם
  // לתוך הספירה, פתיחה מחדש מוציאה אותם ממנה זמנית (בלי למחוק את הסימון עצמו).
  const lockedGameIds = new Set(games.filter(g => g.attendance_locked).map(g => g.id));
  const attendanceCounts = {};
  regs.forEach(r => { if (r.attended && lockedGameIds.has(r.game_id)) attendanceCounts[r.player_id] = (attendanceCounts[r.player_id]||0) + 1; });

  if (!loaded || !identityLoaded) return <div style={S.loading}>טוען…</div>;

  return (
    <div dir="rtl" style={S.app}>
      <Header view={view} setView={setView} />
      {err && <div style={S.errBar}>{err}</div>}
      {view === "player" ? (
        <PlayerView {...{ roster, pending, games: gamesWithRegs, session, identity, now, refresh, loadIdentity, attendanceCounts, authError }} />
      ) : (
        <AdminView {...{ roster, pending, games: gamesWithRegs, now, role, setRole,
          admins, myPhone, refresh, session, cred, setCred, attendanceCounts }} />
      )}
      <footer style={S.footer}>כדורגל גניגרי ושות' · ניהול הרשמה למשחק</footer>
    </div>
  );
}

function Header({ view, setView }) {
  const tapCount = useRef(0);
  const tapTimer = useRef(null);

  const handleBallTap = () => {
    if (view === "admin") return;
    tapCount.current += 1;
    if (tapTimer.current) clearTimeout(tapTimer.current);
    tapTimer.current = setTimeout(() => { tapCount.current = 0; }, 2500);
    if (tapCount.current >= 5) {
      tapCount.current = 0;
      setView("admin");
    }
  };

  return (
    <header style={S.header}>
      <div style={S.brand}>
        <span style={S.ball} onClick={handleBallTap}>⚽</span>
        <div><div style={S.brandTitle}>כדורגל גניגרי ושות'</div><div style={S.brandSub}>רישום למשחקים</div></div>
      </div>
      <div style={{display:"flex", gap:8, alignItems:"center"}}>
        <InstallButton />
        {view === "admin" && (
          <button style={S.backBtn} onClick={()=>setView("player")}>→ חזרה למסך שחקן</button>
        )}
      </div>
    </header>
  );
}

// כפתור "הוסף למסך הבית" — מציג הנחיה ידנית לפי מערכת ההפעלה (תפריט דפדפן).
// בכוונה לא משתמש בדיאלוג ההתקנה האוטומטי (beforeinstallprompt) — manifest.json
// מוגדר עם display:"browser" בדיוק כדי שזה יישאר קיצור-דרך פשוט (סימניה עם
// אייקון) ולא "התקנת אפליקציה" מלאה, כי ההתקנה המלאה (WebAPK) עוברת בדיקת
// Google Play Protect שתוקעת חלק ממשתמשי אנדרואיד. סימניה פשוטה עוקפת את זה
// לגמרי, במחיר פס כתובת דק שנשאר גלוי כשפותחים מהמסך הבית.
function InstallButton() {
  const [standalone, setStandalone] = useState(true);
  const [isIOS, setIsIOS] = useState(false);
  const [showHelp, setShowHelp] = useState(false);

  useEffect(() => {
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    setStandalone(isStandalone);
    setIsIOS(/iPad|iPhone|iPod/.test(navigator.userAgent || "") && !window.MSStream);
  }, []);

  if (standalone) return null;

  return (
    <>
      <button style={S.installBtn} onClick={()=>setShowHelp(true)}>📲 הוסף למסך הבית</button>
      {showHelp && (
        <div style={S.iosHelpOverlay} onClick={()=>setShowHelp(false)}>
          <div style={S.iosHelpBox} onClick={e=>e.stopPropagation()}>
            <h3 style={S.centerTitle}>הוספה למסך הבית</h3>
            {isIOS ? (
              <p style={S.centerText}>ב-Safari: לחץ על כפתור השיתוף <b>⬆️</b> בסרגל הדפדפן, ואז בחר <b>"הוסף למסך הבית"</b>.<br/>ב-Chrome: לחץ על שלוש הנקודות <b>⋮</b>, ובחר <b>"התקנה ויצירת קיצור דרך"</b>.</p>
            ) : (
              <p style={S.centerText}>לחץ על שלוש הנקודות <b>⋮</b> בפינת הדפדפן, ובחר באפשרות להוספה למסך הבית — לפעמים נקראת <b>"הוסף למסך הבית"</b>, ולפעמים <b>"התקנה ויצירת קיצור דרך"</b> (תלוי בגרסת הדפדפן).</p>
            )}
            <button className="btn primary" style={{width:"100%"}} onClick={()=>setShowHelp(false)}>הבנתי</button>
          </div>
        </div>
      )}
    </>
  );
}

// ============================================================================
// צד שחקן
// ============================================================================
function PlayerView({ roster, pending, games, session, identity, now, refresh, loadIdentity, attendanceCounts, authError }) {
  const signOut = async () => { try { localStorage.removeItem("pendingJoin"); } catch {} await db.auth.signOut(); await loadIdentity(); };

  // אין חיבור מאומת כלל — טופס הצטרפות מלא (שם+טלפון+מייל) לפני האימות
  if (!session) {
    return <JoinScreen roster={roster} pending={pending} authError={authError} />;
  }
  // מחובר אך אין עדיין שחקן/בקשה מקושרים — שולח אוטומטית את הפרטים שנשמרו לפני האימות
  if (!identity) {
    return <AutoSubmitScreen session={session} refresh={refresh} loadIdentity={loadIdentity} roster={roster} pending={pending} />;
  }
  if (identity.status === "pending") {
    return (
      <main style={S.main}>
        <section style={S.card}>
          <div style={S.waitBig}>⏳</div>
          <h2 style={S.centerTitle}>הבקשה שלך ממתינה לאישור</h2>
          <p style={S.centerText}>שלום {identity.name}, הבקשה שלך נשלחה למנהל. לאחר אישור תוכל להירשם למשחקים.</p>
          <button className="btn" style={{marginTop:8}} onClick={signOut}>התנתק</button>
        </section>
      </main>
    );
  }

  const me = roster.find(p => p.id === identity.player_id);
  if (!me) return <div style={S.loading}>טוען…</div>;

  // ברגע שהמשחק מתחיל (kickoff הגיע) הוא נעלם למשתמש — אחרת הוא ממשיך
  // להופיע כאילו ההרשמה פתוחה (isOpen בודק רק שההרשמה נפתחה, בלי גבול
  // עליון), גם למשחק שכבר הסתיים ונעל. ר' שיחה עם המשתמש.
  //
  // משחק שלא מסומן לקבוצה של השחקן פשוט לא קיים מבחינתו — לא חסימת
  // הרשמה, אלא הסתרה מלאה מהרשימה (כאילו לא נשלחה לו הזמנה בכלל).
  const visible = games.filter(g => g.published !== false && now < g.kickoff &&
    (me.player_group === "secondary" ? g.visibleToSecondary : g.visibleToPrimary)
  ).sort((a,b)=>a.kickoff-b.kickoff);
  const nextToOpen = visible.filter(g => now < g.opensAt).sort((a,b)=>a.opensAt-b.opensAt)[0];
  // הבאנר תמיד מוצג מעל הכרטיס הראשון ברשימה — אם המשחק הבא-להיפתח הוא גם
  // המשחק הראשון (אין משחק פתוח שמופיע לפניו), הבאנר צמוד ישירות לכרטיס
  // שלו, ואז כותרת היום/שעה של הכרטיס עצמו מיותרת (כפילות ממש צמודה).
  // אם הוא לא ראשון — הבאנר רחוק מהכרטיס, וצריך שהכרטיס יציג את זה בעצמו.
  const bannerAdjacentGameId = (nextToOpen && visible[0] && visible[0].id===nextToOpen.id) ? nextToOpen.id : null;

  return (
    <main style={S.main}>
      <section style={S.hello}>
        <div style={S.helloName}>שלום, {me.name} 👋</div>
      </section>
      {nextToOpen && <CountdownBanner game={nextToOpen} now={now} />}
      {visible.length===0 && <div style={S.empty}>אין כרגע משחקים מפורסמים.</div>}
      {visible.map(g => <GameCard key={g.id} game={g} roster={roster} me={me} now={now} refresh={refresh} attendanceCounts={attendanceCounts} hideHeader={g.id===bannerAdjacentGameId} />)}
    </main>
  );
}

// מסך הצטרפות — שם, טלפון ומייל בטופס אחד. הפרטים נשמרים מקומית לפני האימות,
// ונשלחים אוטומטית לאחר שהמייל אומת — בלי טופס נוסף.
//
// אימות בקוד מספרי (לא קישור-ללחיצה, אורך הקוד תלוי בהגדרות Supabase ולא
// מקובע כאן): קישורי אימות נופלים קורבן לסריקה
// אוטומטית של Gmail (Safe Browsing) שמבקרת בקישור לפני שהמשתמש בכלל לוחץ
// עליו, "צורבת" את השימוש החד-פעמי, ומשאירה את המשתמש תקוע בלולאה בלי שום
// הסבר (ר' authError למעלה). קוד שמוקלד ידנית לא ניתן ל"סריקה מראש" כי אין
// קישור בכלל — verifyOtp() יוצר session ישירות, בלי redirect. דורש שגם
// תבנית המייל ב-Supabase (Authentication → Email Templates → Magic Link)
// תציג את {{ .Token }} ולא תכלול קישור לחיצה, אחרת הבעיה חוזרת.
function JoinScreen({ roster, pending, authError }) {
  const [name,setName]=useState(""); const [phone,setPhone]=useState(""); const [email,setEmail]=useState("");
  const [err,setErr]=useState(""); const [sent,setSent]=useState(false); const [busy,setBusy]=useState(false);
  const [code,setCode]=useState(""); const [verifying,setVerifying]=useState(false);

  const submit = async () => {
    setErr("");
    if (!validName(name)) { setErr("נא להזין שם פרטי ושם משפחה"); return; }
    if (!validPhone(phone)) { setErr("מספר טלפון לא תקין (למשל 0501234567)"); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { setErr("כתובת מייל לא תקינה"); return; }
    const dupErr = findDuplicate(name, phone, email, roster||[], pending||[], null);
    if (dupErr) { setErr(dupErr); return; }
    setBusy(true);
    try { localStorage.setItem("pendingJoin", JSON.stringify({ name: name.trim(), phone: normPhone(phone) })); } catch {}
    const { error } = await db.auth.signInWithOtp({ email: email.trim() });
    setBusy(false);
    if (error) { setErr("שגיאה בשליחה — נסה שוב"); return; }
    setSent(true);
  };

  const resend = async () => {
    setErr(""); setCode(""); setBusy(true);
    const { error } = await db.auth.signInWithOtp({ email: email.trim() });
    setBusy(false);
    if (error) setErr("שגיאה בשליחה — נסה שוב");
  };

  const verify = async () => {
    setErr("");
    if (!/^\d{4,10}$/.test(code.trim())) { setErr("נא להזין את הקוד שקיבלת במייל"); return; }
    setVerifying(true);
    const { error } = await db.auth.verifyOtp({ email: email.trim(), token: code.trim(), type: "email" });
    setVerifying(false);
    if (error) { setErr("קוד שגוי או שפג תוקפו. אפשר לבקש קוד חדש למטה."); return; }
    // session מתעדכן אוטומטית דרך onAuthStateChange ב-App — אין צורך בניווט ידני
  };

  if (sent) {
    return (
      <main style={S.main}>
        <section style={S.card}>
          <div style={S.waitBig}>📧</div>
          <h2 style={S.centerTitle}>הזן את הקוד שקיבלת</h2>
          <p style={S.centerText}>שלחנו קוד אימות לכתובת {email}.</p>
          {/* לא נקבע אורך קבוע (maxLength/regex) בכוונה — אורך הקוד נקבע ע"י הגדרות
              Supabase (Authentication → Providers → Email) ולא בשליטת הקוד כאן;
              קיבוע ל-6 ספרות גרם לבאג אמיתי כשהפרויקט הזה שולח קוד בן 8 ספרות. */}
          <input style={{...S.input, textAlign:"center", fontSize:24, letterSpacing:4}} value={code}
            onChange={e=>setCode(e.target.value.replace(/\D/g,"").slice(0,10))}
            placeholder="הקוד מהמייל" inputMode="numeric" onKeyDown={e=>e.key==="Enter"&&verify()} />
          {err && <p style={S.errText}>{err}</p>}
          <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={verify} disabled={verifying || code.trim().length<4}>{verifying?"מאמת…":"אמת קוד"}</button>
          <p style={{...S.centerText,fontSize:13,color:"#9ca79c",marginTop:10}}>
            לא רואה את המייל? בדוק גם בתיקיית הספאם. <span style={S.linkText} onClick={resend}>{busy?"שולח…":"שלח קוד חדש"}</span>
            {" · "}<span style={S.linkText} onClick={()=>{setSent(false);setCode("");setErr("");}}>חזרה לעריכת הפרטים</span>
          </p>
        </section>
      </main>
    );
  }

  return (
    <main style={S.main}>
      <section style={S.card}>
        <h2 style={S.centerTitle}>הצטרפות לקבוצה</h2>
        <p style={S.centerText}>מלא את הפרטים ואמת את המייל שלך — פעם אחת בלבד, כדי לוודא שזה באמת אתה.</p>
        {authError && (
          <p style={{...S.errText, background:"#fef2f2", border:"1px solid #fecaca", borderRadius:8, padding:10}}>
            ⚠️ האימות נכשל או פג תוקף. מלא שוב את הפרטים ולחץ על הכפתור — קוד אימות חדש יישלח.
          </p>
        )}

        <label style={S.label}>שם מלא</label>
        <input style={S.input} value={name} onChange={e=>setName(e.target.value)} placeholder="ישראל ישראלי" />
        <label style={{...S.label,marginTop:12}}>מספר טלפון</label>
        <input style={S.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="0501234567" inputMode="tel" type="tel" />

        <label style={{...S.label,marginTop:12}}>כתובת מייל</label>
        <input style={S.input} value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" type="email" onKeyDown={e=>e.key==="Enter"&&submit()} />
        {err && <p style={S.errText}>{err}</p>}
        <button className="btn primary" style={{marginTop:14,width:"100%"}} onClick={submit} disabled={busy}>{busy?"שולח…":"שלח לי קוד אימות"}</button>
      </section>
    </main>
  );
}

// אחרי אימות המייל — שולף את הפרטים שנשמרו לפני האימות ושולח את הבקשה אוטומטית
function AutoSubmitScreen({ session, refresh, loadIdentity, roster, pending }) {
  const [state,setState]=useState("submitting"); // submitting | needProfile | error
  const [name,setName]=useState(""); const [phone,setPhone]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  // הקישור לשחקן קיים (מוזן ידנית בלי מייל, או כבר מאושר אבל מסשן/מכשיר אחר)
  // מטופל כולו בצד השרת בתוך submit_player_request — אין יותר צורך בעדכון ישיר
  // של הטבלה מהדפדפן (ר' תיקון האבטחה: כל כתיבה עוברת דרך RPC מאומת).
  useEffect(() => {
    (async () => {
      let raw = null;
      try { raw = localStorage.getItem("pendingJoin"); } catch {}
      if (!raw) { setState("needProfile"); return; }
      let data;
      try { data = JSON.parse(raw); } catch { setState("needProfile"); return; }

      const dupErr = findDuplicate(data.name, data.phone, session.user.email, roster||[], pending||[], null);
      if (dupErr) { try { localStorage.removeItem("pendingJoin"); } catch {} setState("error"); setErr(dupErr); return; }
      const { data: result, error } = await db.rpc("submit_player_request", { input_name: data.name, input_phone: data.phone, input_email: session.user.email });
      try { localStorage.removeItem("pendingJoin"); } catch {}
      if (error) { setState("error"); return; }
      if (result === "phone_taken") { setState("error"); setErr("מספר הטלפון הזה כבר רשום למשתמש אחר. פנה למנהל."); return; }
      await refresh(); await loadIdentity();
    })();
  }, []);

  const submitProfile = async () => {
    setErr("");
    if (!validName(name)) { setErr("נא להזין שם פרטי ושם משפחה"); return; }
    if (!validPhone(phone)) { setErr("מספר טלפון לא תקין"); return; }
    const dupErr = findDuplicate(name, phone, session.user.email, roster||[], pending||[], null);
    if (dupErr) { setErr(dupErr); return; }
    setBusy(true);
    const { data, error } = await db.rpc("submit_player_request", { input_name: name.trim(), input_phone: normPhone(phone), input_email: session.user.email });
    setBusy(false);
    if (error) { setErr("שגיאה בשליחה, נסה שוב"); return; }
    if (data === "phone_taken") { setErr("מספר הטלפון הזה כבר רשום למשתמש אחר."); return; }
    await refresh(); await loadIdentity();
  };

  if (state === "submitting") return <div style={S.loading}>שולח את הבקשה שלך…</div>;

  if (state === "error") {
    return (
      <main style={S.main}>
        <section style={S.card}>
          <h2 style={S.centerTitle}>לא ניתן לשלוח את הבקשה</h2>
          {err && <p style={S.errText}>{err}</p>}
        </section>
      </main>
    );
  }

  // needProfile — נדיר: המייל אומת ממכשיר אחר מזה שבו מולאו הפרטים
  return (
    <main style={S.main}>
      <section style={S.card}>
        <h2 style={S.centerTitle}>השלמת פרטים</h2>
        <p style={S.centerText}>המייל שלך אומת ✓. לא מצאנו את הפרטים שמילאת — כנראה פתחת את הקישור ממכשיר אחר. מלא שוב:</p>
        <label style={S.label}>שם מלא</label>
        <input style={S.input} value={name} onChange={e=>setName(e.target.value)} placeholder="ישראל ישראלי" />
        <label style={{...S.label,marginTop:12}}>מספר טלפון</label>
        <input style={S.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="0501234567" inputMode="tel" type="tel" onKeyDown={e=>e.key==="Enter"&&submitProfile()} />
        {err && <p style={S.errText}>{err}</p>}
        <button className="btn primary" style={{marginTop:14,width:"100%"}} onClick={submitProfile} disabled={busy}>{busy?"שולח…":"בקש הצטרפות"}</button>
      </section>
    </main>
  );
}

function CountdownBanner({ game, now }) {
  const ms=game.opensAt-now; const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
  const pad=n=>String(n).padStart(2,"0");
  const dow=new Date(game.kickoff).toLocaleDateString("he-IL",{weekday:"long"});
  const time=new Date(game.kickoff).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  return (
    <section style={S.countdown}>
      <div style={S.cdHeadline}>רישום למשחק ב{dow} בשעה {time}</div>
      <div style={S.cdTop}>ההרשמה נפתחת בעוד</div>
      <div style={S.cdClock}>
        {d>0 && <><CdUnit val={d} label="ימים"/><span style={S.cdColon}>:</span></>}
        <CdUnit val={pad(h)} label="שעות"/><span style={S.cdColon}>:</span>
        <CdUnit val={pad(m)} label="דקות"/><span style={S.cdColon}>:</span>
        <CdUnit val={pad(s)} label="שניות"/>
      </div>
      <div style={S.cdOpens}>פתיחת הרשמה {fmt(game.opensAt)}</div>
    </section>
  );
}
function CdUnit({val,label}){ return <div style={S.cdUnit}><div style={S.cdNum}>{val}</div><div style={S.cdLabel}>{label}</div></div>; }

function GameCard({ game, roster, me, now, refresh, attendanceCounts, hideHeader }) {
  const isOpen = now >= game.opensAt;
  const sorted = sortRegs(game.registrations.map(r=>({player_id:r.playerId,ts:r.ts,guest_name:r.guestName})), roster, attendanceCounts);
  const main = sorted.slice(0,MAX_PLAYERS), wait = sorted.slice(MAX_PLAYERS);
  const myReg = game.registrations.find(r=>r.playerId===me.id);
  const myDecline = (game.declines||[]).find(d=>d.playerId===me.id);
  const rosterPublished = game.rosterPublished === true;
  const registrationClosed = game.registrationClosed === true;
  const [busy,setBusy]=useState(false);

  const [regErr,setRegErr]=useState("");
  const register = async () => {
    if(registrationClosed||!isOpen||myReg||busy) return; setBusy(true); setRegErr("");
    const { data, error } = await db.rpc("register_for_game", { input_game_id: game.id, input_player_id: me.id });
    if (error) setRegErr("שגיאה בהרשמה — נסה שוב.");
    else if (data === "not_authorized") setRegErr("לא ניתן לרשום — יש להתחבר מחדש.");
    setBusy(false); await refresh();
  };
  const [cancelErr,setCancelErr]=useState("");
  const unregister = async () => {
    if(registrationClosed) return;
    setCancelErr(""); setBusy(true);
    const { data, error } = await db.rpc("cancel_own_registration", { input_game_id: game.id, input_player_id: me.id });
    setBusy(false);
    if (error || data !== true) setCancelErr("הביטול נכשל — נסה שוב או פנה למנהל.");
    else await refresh();
  };

  // "לא אגיע" — סימון מפורש שהשחקן לא מגיע (בשונה מפשוט לא להירשם), כדי
  // שלאדמין יהיה נתון אמיתי כמה אנשים בפועל לא יגיעו (ר' AdminGameRow). מבטל
  // אוטומטית הרשמה קיימת אם יש — שני המצבים הדדיים, אי אפשר להיות גם וגם.
  const [declineErr,setDeclineErr]=useState("");
  const decline = async () => {
    if(registrationClosed||!isOpen||myDecline||busy) return; setBusy(true); setDeclineErr("");
    const { data, error } = await db.rpc("decline_game", { input_game_id: game.id, input_player_id: me.id });
    if (error) setDeclineErr("שגיאה בסימון — נסה שוב.");
    else if (data === "not_authorized") setDeclineErr("לא ניתן לסמן — יש להתחבר מחדש.");
    setBusy(false); await refresh();
  };
  const cancelDecline = async () => {
    if(registrationClosed) return;
    setDeclineErr(""); setBusy(true);
    const { error } = await db.rpc("cancel_own_decline", { input_game_id: game.id, input_player_id: me.id });
    setBusy(false);
    if (error) setDeclineErr("הביטול נכשל — נסה שוב.");
    else await refresh();
  };

  return (
    <section style={S.gameCard}>
      {registrationClosed ? (
        <div style={S.closedBanner}>
          <div style={S.closedBannerTitle}>🔒 ההרשמה סגורה</div>
          <div style={S.closedBannerSub}>למשחק ב{dayName(game.kickoff)} בשעה {fmtTime(game.kickoff)}</div>
        </div>
      ) : isOpen ? (
        <div style={S.openBanner}>
          <div style={S.openBannerTitle}>🟢 ההרשמה פתוחה</div>
          <div style={S.openBannerSub}>למשחק ב{dayName(game.kickoff)} בשעה {fmtTime(game.kickoff)}</div>
        </div>
      ) : !hideHeader && (
        <div style={S.gameHead}>
          <div><div style={S.gameDay}>{dayName(game.kickoff)}</div><div style={S.gameTime}>{fmtTime(game.kickoff)}</div></div>
        </div>
      )}
      {isOpen && <div style={S.liveCountBar}>👥 {game.registrations.length} נרשמו עד כה למשחק</div>}
      {isOpen && !rosterPublished && !registrationClosed && game.registrations.length>0 &&
        <LiveRegisteredNames regs={game.registrations} roster={roster} meId={me.id} />}
      {registrationClosed ? null : isOpen ? (
        myReg ? (
          <div style={S.regBox}>
            <div style={S.regConfirm}><span style={S.regCheck}>✓</span> נרשמת למשחק</div>
            {rosterPublished
              ? <div style={S.lockedNote}>הרשימה פורסמה ונעולה. לביטול הגעה — פנה למנהל.</div>

          </div>
        ) : myDecline ? (
          <div style={S.regBox}>
            <div style={S.declineConfirm}><span>✕</span> סימנת שלא תגיע למשחק</div>

            <button className="btn" onClick={cancelDecline} disabled={busy}>בטל סימון</button>
            {regErr && <p style={S.errText}>{regErr}</p>}
            {declineErr && <p style={S.errText}>{declineErr}</p>}
          </div>
        ) : (
          <>
            <div style={{display:"flex", gap:8}}>
              <button className="btn primary" style={{flex:1, padding:14, fontSize:16}} onClick={register} disabled={busy}>{busy?"…":"מגיע ✓"}</button>
              <button className="btn danger" style={{flex:1, padding:14, fontSize:16}} onClick={decline} disabled={busy}>לא אגיע</button>
            </div>
            {regErr && <p style={S.errText}>{regErr}</p>}
            {declineErr && <p style={S.errText}>{declineErr}</p>}
          </>
        )
      ) : <div style={S.closedNote}>ההרשמה עדיין סגורה</div>}
      {(rosterPublished || registrationClosed) ? (
        <><div style={S.publishedTag}>{registrationClosed && !rosterPublished ? "רשימה סגורה" : "רשימת המשתתפים פורסמה"}</div>
        <PlayerRosterList main={main} wait={wait} roster={roster} meId={me.id} /></>
      ) : (myReg && <div style={S.pendingRoster}>רשימת המשתתפים במשחק תפורסם בקבוצת הוואטסאפ, בהתאם למגבלת כמות השחקנים במשחק.</div>)}
    </section>
  );
}

// רשימת שמות "חיה" — מי שרשום עד כה כשההרשמה עדיין פתוחה ולפני פרסום

// עוד לא נקבע) — רק סדר יציב לפי זמן הרשמה, כדי ששמות קיימים לא יזוזו
// כשמצטרפים חדשים.
function LiveRegisteredNames({ regs, roster, meId }) {
  const nameOf = id => (roster.find(r=>r.id===id)||{}).name || "—";
  const displayName = r => r.guestName ? (r.guestName+" (אורח)") : nameOf(r.playerId);
  const ordered = [...regs].sort((a,b)=>a.ts-b.ts);
  return (
    <ol style={S.ol}>

}

function PlayerRosterList({ main, wait, roster, meId }) {

  return (

            {wait.map((r,i)=><li key={r.player_id} style={r.player_id===meId?S.liMe:S.liWait}><span style={S.num}>{i+1}</span><span style={S.pname}>{displayName(r)}</span></li>)}

function AdminView({ roster, pending, games, now, role, setRole, admins, myPhone, refresh, session, cred, setCred, attendanceCounts }) {
  const [pw,setPw]=useState(""); const [pin,setPin]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const [hint,setHint]=useState(null); // 'super' | 'admin' | null — רמז בלבד, לא מעניק הרשאה
  // דירוגי שחקנים לחלוקת כוחות (ר' migrations/0014) — נשמרים בטבלה נעולה,
  // בלי SELECT ציבורי, נטענים רק כאן דרך RPC אדמין אחרי התחברות מוצלחת.
  const [grades,setGrades]=useState({});
  const refreshGrades = async () => {
    if (!cred) return;
    const rows = await callAdmin("admin_get_player_grades", { input_pw: cred.pw||null, input_phone: cred.phone||null, input_pin: cred.pin||null });
    const map = {};
    (rows||[]).forEach(r => { map[r.player_id] = r.grade; });
    setGrades(map);
  };

  useEffect(() => {
    let alive = true;
    if (myPhone && !role) {
      api.loginHint(myPhone).then(r => { if (alive) setHint(r); });
    } else {
      setHint(null);
    }
    return () => { alive = false; };
  }, [myPhone, role]);

  useEffect(() => { if (role) refreshGrades(); }, [role]);

  if (!role) {
    const tryLoginPw = async () => {
      setErr(""); setBusy(true);
      const r = await api.checkLogin(pw, null, null);
      setBusy(false);
      if (r === "super") { setCred({ pw }); setRole(r); return; }
      if (r === "locked") { setErr("יותר מדי ניסיונות שגויים. נסה שוב בעוד כמה דקות."); return; }
      setErr("סיסמה שגויה");
    };
    const tryLoginPin = async () => {
      setErr(""); setBusy(true);
      const r = await api.checkLogin(null, myPhone, pin);
      setBusy(false);
      if (r === "admin") { setCred({ phone: myPhone, pin }); setRole(r); return; }
      if (r === "locked") { setErr("יותר מדי ניסיונות שגויים. נסה שוב בעוד כמה דקות."); return; }
      setErr("קוד אישי שגוי");
    };
    return (
      <main style={S.main}>
        {hint === "super" && (
          <section style={{...S.card,...S.cardHot}}>
            <p style={S.hint}>המכשיר הזה מזוהה כאדמין-על — עדיין נדרשת סיסמה לאישור, לביטחונך.</p>
          </section>
        )}
        {hint === "admin" && (
          <section style={{...S.card,...S.cardHot}}>
            <p style={S.hint}>המכשיר הזה מזוהה כמנהל. הזן את הקוד האישי שבחרת בעת ההצטרפות:</p>
            <input style={S.input} type="password" inputMode="numeric" placeholder="קוד אישי" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLoginPin()} />
            <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={tryLoginPin} disabled={busy}>{busy?"בודק…":"כניסה כמנהל"}</button>
          </section>
        )}
        <section style={S.card}>
          <label style={S.label}>כניסת אדמין-על</label>
          <p style={S.hint}>מיועד לאדמין-על בלבד. הזיהוי לפי טלפון הוא רמז בלבד — הכניסה בפועל תמיד דורשת את הסיסמה.</p>
          <input style={S.input} type="password" placeholder="סיסמת אדמין-על" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLoginPw()} />
          <button className="btn primary" style={{marginTop:10}} onClick={tryLoginPw} disabled={busy}>{busy?"בודק…":"כניסה"}</button>
          {err && <p style={S.errText}>{err}</p>}
        </section>
        <RedeemInviteForm {...{ myPhone, setRole, setCred, refresh }} />
        <ResetPinForm {...{ myPhone, setRole }} />
      </main>
    );
  }

  const isSuper = role === "super";
  return (
    <main style={S.main}>
      <section style={S.roleBar}>
        <span style={S.roleTag}>{isSuper?"אדמין־על":"מנהל"}</span>
        <button className="btn small" onClick={()=>{setRole(null);setCred(null);setPw("");setPin("");}}>יציאה</button>
      </section>
      {isSuper && (
        <>
          <SuperAdminPanel {...{ admins, roster, refresh, cred, session }} />
          <PendingRequests {...{ pending, roster, refresh, cred }} />
        </>
      )}
      <AdminGames {...{ games, roster, now, refresh, cred, attendanceCounts, grades, refreshGrades }} />
      {isSuper && <AdminRoster {...{ roster, admins, refresh, cred, attendanceCounts, grades, refreshGrades }} />}
    </main>
  );
}

// טופס למי שקיבל קוד הזמנה מהאדמין-על — רק זה שיש לו קוד תקף יכול להיכנס
// למנהל ששכח את הקוד האישי שלו — מאפס עם קוד איפוס חד-פעמי מהאדמין-על
function ResetPinForm({ myPhone, setRole }) {
  const [open,setOpen]=useState(false);
  const [phone,setPhone]=useState(myPhone||""); const [code,setCode]=useState("");
  const [pin,setPin]=useState(""); const [pin2,setPin2]=useState("");
  const [err,setErr]=useState(""); const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);

  if (!open) {
    return (
      <p style={{...S.hint,textAlign:"center"}}>
        <span style={S.linkText} onClick={()=>setOpen(true)}>שכחת את הקוד האישי שלך?</span>
      </p>
    );
  }

  const submit = async () => {
    setErr(""); setMsg("");
    if (!validPhone(phone)) { setErr("טלפון לא תקין"); return; }
    if (!code.trim()) { setErr("נא להזין את קוד האיפוס שקיבלת"); return; }
    if (pin.trim().length < 4) { setErr("הקוד האישי החדש חייב להיות באורך 4 ספרות לפחות"); return; }
    if (pin.trim() !== pin2.trim()) { setErr("הקוד האישי וחזרה עליו לא תואמים"); return; }
    setBusy(true);
    const result = await api.redeemPinReset(normPhone(phone), code.trim(), pin.trim());
    setBusy(false);
    if (result === "ok") { setMsg("הקוד עודכן! אפשר להיכנס עכשיו עם הקוד החדש."); setCode(""); setPin(""); setPin2(""); return; }
    if (result === "not_admin") setErr("המספר הזה אינו רשום כמנהל.");
    else if (result === "pin_too_short") setErr("הקוד האישי קצר מדי");
    else if (result === "locked") setErr("יותר מדי ניסיונות שגויים עם המספר הזה. נסה שוב בעוד כמה דקות.");
    else setErr("קוד איפוס שגוי או שפג תוקפו. בקש קוד חדש מהאדמין-על.");
  };

  return (
    <section style={S.card}>
      <h2 style={S.h2}>איפוס קוד אישי</h2>
      <p style={S.hint}>בקש מהאדמין-על קוד איפוס, והזן אותו כאן יחד עם קוד אישי חדש.</p>
      <label style={S.labelSm}>מספר טלפון</label>
      <input style={S.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="0501234567" inputMode="tel" />
      <label style={{...S.labelSm,marginTop:8}}>קוד איפוס (מהאדמין-על)</label>
      <input style={S.input} value={code} onChange={e=>setCode(e.target.value)} placeholder="6 ספרות" inputMode="numeric" />
      <label style={{...S.labelSm,marginTop:8}}>קוד אישי חדש</label>
      <input style={S.input} type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="לדוגמה 1234" inputMode="numeric" />
      <label style={{...S.labelSm,marginTop:8}}>אימות הקוד החדש</label>
      <input style={S.input} type="password" value={pin2} onChange={e=>setPin2(e.target.value)} placeholder="הקלד שוב" inputMode="numeric" onKeyDown={e=>e.key==="Enter"&&submit()} />
      {err && <p style={S.errText}>{err}</p>}
      {msg && <p style={{...S.hint,color:"#166534",fontWeight:700}}>{msg}</p>}
      <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={submit} disabled={busy}>{busy?"מעדכן…":"אפס קוד אישי"}</button>
    </section>
  );
}

function RedeemInviteForm({ myPhone, setRole, setCred, refresh }) {
  const [phone,setPhone]=useState(myPhone||""); const [code,setCode]=useState("");
  const [pin,setPin]=useState(""); const [pin2,setPin2]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  const submit = async () => {
    setErr("");
    if (!validPhone(phone)) { setErr("טלפון לא תקין"); return; }
    if (!code.trim()) { setErr("נא להזין את הקוד שקיבלת"); return; }
    if (pin.trim().length < 4) { setErr("הקוד האישי חייב להיות באורך 4 ספרות לפחות"); return; }
    if (pin.trim() !== pin2.trim()) { setErr("הקוד האישי וחזרה עליו לא תואמים"); return; }
    setBusy(true);
    const result = await api.redeemInvite(normPhone(phone), code.trim(), pin.trim());
    setBusy(false);
    if (result === "ok") {
      await refresh();
      setCred({ phone: normPhone(phone), pin: pin.trim() });
      setRole("admin");
      return;
    }
    if (result === "not_a_player") setErr("המספר הזה עדיין לא רשום ומאושר כשחקן בקבוצה. יש להירשם קודם כשחקן.");
    else if (result === "already_admin") setErr("המספר הזה כבר מוגדר כמנהל — נסה להיכנס עם הקוד האישי שלך.");
    else if (result === "pin_too_short") setErr("הקוד האישי קצר מדי");
    else if (result === "locked") setErr("יותר מדי ניסיונות שגויים עם המספר הזה. נסה שוב בעוד כמה דקות.");
    else setErr("קוד הזמנה שגוי או שפג תוקפו. בקש קוד חדש מהאדמין-על.");
  };

  return (
    <section style={S.card}>
      <h2 style={S.h2}>יש לך הזמנה להיות מנהל?</h2>
      <p style={S.hint}>רק אדמין-על יכול להזמין מנהל. אם קיבלת ממנו קוד — הזן אותו כאן, ובחר קוד אישי משלך (שרק אתה תדע) לכניסות הבאות.</p>
      <label style={S.labelSm}>מספר טלפון</label>
      <input style={S.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="0501234567" inputMode="tel" />
      <label style={{...S.labelSm,marginTop:8}}>קוד הזמנה (מהאדמין-על)</label>
      <input style={S.input} value={code} onChange={e=>setCode(e.target.value)} placeholder="6 ספרות" inputMode="numeric" />
      <label style={{...S.labelSm,marginTop:8}}>בחר קוד אישי (4 ספרות לפחות, רק אתה תדע)</label>
      <input style={S.input} type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="לדוגמה 1234" inputMode="numeric" />
      <label style={{...S.labelSm,marginTop:8}}>אימות הקוד האישי</label>
      <input style={S.input} type="password" value={pin2} onChange={e=>setPin2(e.target.value)} placeholder="הקלד שוב" inputMode="numeric" onKeyDown={e=>e.key==="Enter"&&submit()} />
      {err && <p style={S.errText}>{err}</p>}
      <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={submit} disabled={busy}>{busy?"בודק…":"אשר הזמנה"}</button>
    </section>
  );
}

// יומן שגיאות: נטען רק בלחיצה (לא בטעינת הדף), כי הוא לא נחוץ ברוב הביקורים
// באדמין-על — ומכיוון ש-client_errors חסומה ל-SELECT ישיר, זו הדרך היחידה
// לצפות בו מלבד שאילתה ידנית ב-Supabase Dashboard (ר' get_client_errors).
function ClientErrorLog({ cred }) {
  const [open,setOpen] = useState(false);
  const [errors,setErrors] = useState(null); // null = עוד לא נטען
  const [busy,setBusy] = useState(false);

  const load = async () => {
    setBusy(true);
    const data = await callAdmin("get_client_errors", { input_pw: cred.pw, input_limit: 200 });
    setBusy(false);
    setErrors(data || []);
  };

  const toggle = async () => {
    if (!open && errors === null) await load();
    setOpen(o => !o);
  };

  return (
    <section style={S.card}>
      <div style={S.rowBetween}>
        <h2 style={S.h2}>📋 יומן שגיאות</h2>
        <button className="btn small" onClick={toggle}>{open ? "סגור" : "פתח יומן"}</button>
      </div>
      <p style={S.hint}>שגיאות לא צפויות שקרו אצל משתמשים (קריסת מסך, כישלון פעולת ניהול) — נרשמות אוטומטית, בלי שהמשתמש צריך לדווח.</p>
      {open && (
        <div style={{marginTop:10}}>
          <button className="btn small" onClick={load} disabled={busy} style={{marginBottom:8}}>{busy?"טוען…":"רענן"}</button>
          {!busy && errors && errors.length===0 && <p style={S.hint}>אין שגיאות רשומות 🎉</p>}
          {!busy && (errors||[]).map(e=>(
            <div key={e.id} style={S.errorRow}>
              <div style={S.rowBetween}>
                <b style={{fontSize:13}}>{e.context || "—"}</b>
                <span style={S.subLine}>{fmt(e.created_at)}</span>
              </div>
              <div style={{fontSize:13,marginTop:2}}>{e.message}</div>
              {e.url && <div style={{...S.subLine,wordBreak:"break-all"}}>{e.url}</div>}
            </div>
          ))}
        </div>
      )}
    </section>
  );
}

// איפוס קוד אישי למנהל שכבר קיים ששכח אותו
function AdminPinResets({ admins }) {
  const [superPw,setSuperPw]=useState("");
  const [targetPhone,setTargetPhone]=useState("");
  const [lastCode,setLastCode]=useState(null);
  const [resets,setResets]=useState([]);
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  const loadResets = async (pw) => { const r = await api.listPinResets(pw); if (r.ok) setResets(r.resets); };
  const nameOfPhone = ph => (admins.find(a=>a.phone===ph)||{}).name || ph;

  const create = async () => {
    setErr(""); setLastCode(null);
    if (!superPw.trim()) { setErr("נא להזין סיסמת אדמין-על"); return; }
    if (!targetPhone) { setErr("בחר מנהל לאיפוס"); return; }
    setBusy(true);
    const r = await api.createPinReset(superPw.trim(), targetPhone);
    setBusy(false);
    if (!r.ok) { setErr("שגיאה — ודא שסיסמת האדמין-על נכונה"); return; }
    setLastCode(r.code);
    await loadResets(superPw.trim());
  };
  const cancel = async (id) => {
    if (!superPw.trim()) { setErr("נא להזין סיסמת אדמין-על כדי לבטל"); return; }
    await api.cancelPinReset(superPw.trim(), id);
    await loadResets(superPw.trim());
  };
  const shareWa = (phone, code) => {
    const text = "היי! אדמין-העל אישר איפוס קוד אישי עבורך באפליקציית כדורגל גניגרי ושות'.\nהיכנס ללשונית ניהול, לחץ על \"שכחת את הקוד האישי?\" והזן את קוד האיפוס: " + code;
    window.open("https://wa.me/972"+phone.replace(/^0/,"")+"?text="+encodeURIComponent(text), "_blank");
  };

  return (
    <section style={S.card}>
      <h2 style={S.h2}>איפוס קוד אישי למנהל</h2>
      <p style={S.hint}>אם מנהל שכח את הקוד האישי שלו — צור לו כאן קוד איפוס חד-פעמי ושלח אותו ידנית.</p>

      <label style={S.labelSm}>סיסמת אדמין-על (לאימות פעולה זו)</label>
      <input style={S.input} type="password" value={superPw} onChange={e=>setSuperPw(e.target.value)} onBlur={()=>superPw&&loadResets(superPw)} />

      <label style={{...S.labelSm,marginTop:10}}>בחר מנהל</label>
      <select style={S.selectSm2} value={targetPhone} onChange={e=>setTargetPhone(e.target.value)}>
        <option value="">— בחר —</option>
        {admins.map(a=><option key={a.id} value={a.phone}>{a.name} · {a.phone}</option>)}
      </select>

      {err && <p style={S.errText}>{err}</p>}
      <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={create} disabled={busy}>{busy?"יוצר…":"צור קוד איפוס"}</button>

      {lastCode && (
        <div style={S.codeBox}>
          <div style={S.codeLabel}>קוד האיפוס עבור {nameOfPhone(targetPhone)}:</div>
          <div style={S.codeValue}>{lastCode}</div>
          <button className="btn waBtn" onClick={()=>shareWa(targetPhone, lastCode)}>שלח קוד בוואטסאפ</button>
        </div>
      )}

      {resets.length > 0 && (
        <div style={{marginTop:14}}>
          <div style={S.listTitle}>איפוסים ממתינים ({resets.length})</div>
          {resets.map(r=>(
            <div key={r.id} style={S.rosterRow}>
              <div><div style={S.pname}>{nameOfPhone(r.admin_phone)}</div><div style={S.subLine}>{r.admin_phone} · קוד {r.code}</div></div>
              <button className="mini danger" onClick={()=>cancel(r.id)}>✕</button>

// הזמנת מנהלים חדשים: רק שחקן שכבר מאושר ברשימה יכול להיבחר,
// ורק מי שיקבל ממך את הקוד בפועל (ידנית, בוואטסאפ למשל) יוכל לממש אותו.
function AdminInvites({ admins, roster, refresh }) {
  const [superPw,setSuperPw]=useState("");
  const [targetPhone,setTargetPhone]=useState("");
  const [lastCode,setLastCode]=useState(null);
  const [invites,setInvites]=useState([]);
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  const eligible = roster.filter(p => !admins.some(a=>a.phone===p.phone));

  const loadInvites = async (pw) => {
    const r = await api.listInvites(pw);
    if (r.ok) setInvites(r.invites);
  };
  useEffect(() => { if (superPw) loadInvites(superPw); }, []); // eslint-disable-line

  const create = async () => {
    setErr(""); setLastCode(null);
    if (!superPw.trim()) { setErr("נא להזין סיסמת אדמין-על"); return; }
    if (!targetPhone) { setErr("בחר שחקן להזמנה"); return; }
    setBusy(true);
    const r = await api.createInvite(superPw.trim(), targetPhone);
    setBusy(false);
    if (!r.ok) { setErr("שגיאה — ודא שסיסמת האדמין-על נכונה"); return; }
    setLastCode(r.code);
    await loadInvites(superPw.trim());
  };

  const cancel = async (id) => {
    if (!superPw.trim()) { setErr("נא להזין סיסמת אדמין-על כדי לבטל"); return; }
    await api.cancelInvite(superPw.trim(), id);
    await loadInvites(superPw.trim());
  };

  const nameOfPhone = ph => (roster.find(r=>r.phone===ph)||{}).name || ph;
  const shareWa = (phone, code) => {
    const text = "היי! אתה מוזמן להיות מנהל באפליקציית כדורגל גניגרי ושות'.\nהיכנס ללשונית ניהול והזן את הקוד: " + code;
    window.open("https://wa.me/972"+phone.replace(/^0/,"")+"?text="+encodeURIComponent(text), "_blank");
  };

  return (
    <section style={S.card}>
      <h2 style={S.h2}>הזמנת מנהל חדש</h2>
      <p style={S.hint}>ניתן להזמין רק שחקן שכבר מאושר ברשימה. תישלח לך כאן הזמנה חד-פעמית — יש לשלוח אותה ידנית (למשל בוואטסאפ) לשחקן, כדי לוודא שזה באמת הוא.</p>

      <label style={S.labelSm}>סיסמת אדמין-על (לאימות פעולה זו)</label>
      <input style={S.input} type="password" value={superPw} onChange={e=>{ setSuperPw(e.target.value); }} onBlur={()=>superPw&&loadInvites(superPw)} />

      <label style={{...S.labelSm,marginTop:10}}>בחר שחקן</label>
      <select style={S.selectSm2} value={targetPhone} onChange={e=>setTargetPhone(e.target.value)}>
        <option value="">— בחר —</option>
        {eligible.map(p=><option key={p.id} value={p.phone}>{p.name} · {p.phone}</option>)}
      </select>

      {err && <p style={S.errText}>{err}</p>}
      <button className="btn primary" style={{marginTop:10,width:"100%"}} onClick={create} disabled={busy}>{busy?"יוצר…":"צור קוד הזמנה"}</button>

      {lastCode && (
        <div style={S.codeBox}>
          <div style={S.codeLabel}>הקוד עבור {nameOfPhone(targetPhone)}:</div>
          <div style={S.codeValue}>{lastCode}</div>
          <button className="btn waBtn" onClick={()=>shareWa(targetPhone, lastCode)}>שלח קוד בוואטסאפ</button>
        </div>
      )}

      {invites.length > 0 && (
        <div style={{marginTop:14}}>
          <div style={S.listTitle}>הזמנות ממתינות ({invites.length})</div>
          {invites.map(inv=>(
            <div key={inv.id} style={S.rosterRow}>
              <div><div style={S.pname}>{nameOfPhone(inv.player_phone)}</div><div style={S.subLine}>{inv.player_phone} · קוד {inv.code}</div></div>
              <button className="mini danger" onClick={()=>cancel(inv.id)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </section>
  );
}

// הסיסמאות הנוכחיות אינן ניתנות לקריאה מהדפדפן — הטופס תמיד ריק, וכל שמירה
// דורשת את סיסמת האדמין-על הנוכחית לאימות (מאומת בתוך בסיס הנתונים בלבד).
const SUPER_SETTINGS_EMAIL = "nadavfichman@gmail.com";

// שינוי סיסמת אדמין-על נעול מאחורי אימות מייל אמיתי (לא רק סיסמה נוכחית) —
// כדי שגם אם מישהו יודע את הסיסמה הנוכחית, הוא לא יוכל לשנות אותה בלי גישה
// בפועל לתיבת המייל של nadavfichman@gmail.com. משתמש באותו מנגנון קישור-במייל
// שכבר קיים לשחקנים (db.auth.signInWithOtp) — אין צורך בשירות מייל נוסף.
function SuperSettings({ refresh, session }) {
  const [currentSuperPw,setCurrentSuperPw]=useState("");
  const [superPw,setSuperPw]=useState("");
  const [superPhone,setSuperPhone]=useState("");
  const [msg,setMsg]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const [sentEmail,setSentEmail]=useState(false); const [emailBusy,setEmailBusy]=useState(false);

  const emailVerified = session && normEmail(session.user.email) === SUPER_SETTINGS_EMAIL;

  const sendVerification = async () => {
    setEmailBusy(true); setErr("");
    const { error } = await db.auth.signInWithOtp({ email: SUPER_SETTINGS_EMAIL, options: { emailRedirectTo: window.location.href } });
    setEmailBusy(false);
    if (error) { setErr("שגיאה בשליחת מייל האימות — נסה שוב"); return; }
    setSentEmail(true);
  };

  const save = async () => {
    setErr(""); setMsg("");
    if (!emailVerified) { setErr("יש לאמת קודם את המייל"); return; }
    if (!currentSuperPw.trim()) { setErr("נא להזין את סיסמת האדמין-על הנוכחית לאימות"); return; }
    if (!superPw.trim()) { setErr("הסיסמה החדשה לא יכולה להיות ריקה"); return; }
    if (superPhone && !validPhone(superPhone)) { setErr("טלפון אדמין לא תקין"); return; }
    setBusy(true);
    const ok = await api.updateSettings(currentSuperPw.trim(), superPw.trim(), superPhone?normPhone(superPhone):null);
    setBusy(false);
    if (!ok) { setErr("סיסמת האדמין-על הנוכחית שגויה, או שהאימות במייל פג — לא נשמר"); return; }
    setMsg("נשמר"); setCurrentSuperPw(""); setTimeout(()=>setMsg(""),2500); await refresh();
  };

  return (
    <section style={S.card}>
      <h2 style={S.h2}>הגדרות אדמין-על</h2>
      <p style={S.hint}>רק אתה רואה את המסך הזה. אין יותר סיסמה למנהלים — הם נכנסים רק לפי טלפון מזוהה. הסיסמה כאן היא שלך בלבד.</p>

      {!emailVerified ? (
        <div style={{...S.formBox, marginTop:12}}>
          <p style={S.hint}>לפני שינוי הסיסמה — יש לאמת שאתה בעל תיבת המייל {SUPER_SETTINGS_EMAIL}.</p>
          {!sentEmail ? (
            <button className="btn primary" style={{marginTop:6}} onClick={sendVerification} disabled={emailBusy}>{emailBusy?"שולח…":"שלח לי קישור אימות"}</button>
          ) : (
            <p style={{...S.hint,fontWeight:700}}>נשלח קישור ל-{SUPER_SETTINGS_EMAIL}. פתח את המייל ולחץ על הקישור, ואז חזור לכאן — הטופס ייפתח אוטומטית.</p>
          )}
        </div>
      ) : (
        <>
          <label style={S.labelSm}>אימות: סיסמת האדמין-על הנוכחית</label>
          <input style={S.input} type="password" value={currentSuperPw} onChange={e=>setCurrentSuperPw(e.target.value)} placeholder="נדרש לאישור כל שינוי" />

          <label style={{...S.labelSm,marginTop:14}}>סיסמת אדמין-על חדשה (רק לך)</label>
          <input style={S.input} value={superPw} onChange={e=>setSuperPw(e.target.value)} placeholder="הזן ערך חדש" />
          <label style={{...S.labelSm,marginTop:10}}>מספר הטלפון שלך (זיהוי אדמין-על)</label>
          <input style={S.input} value={superPhone} inputMode="tel" placeholder="0501234567" onChange={e=>setSuperPhone(e.target.value)} />
          <p style={{...S.hint,fontSize:12}}>תיכנס כאדמין-על אוטומטית מהמכשיר הזה, או בכל מכשיר עם סיסמת האדמין-על. אם תחליף מספר — עדכן כאן.</p>
          <button className="btn primary" style={{marginTop:10}} onClick={save} disabled={busy}>{busy?"שומר…":"שמור הגדרות"}</button>
        </>
      )}
      {err && <p style={S.errText}>{err}</p>}
      {msg && <p style={{...S.hint,color:"#166534",fontWeight:700}}>{msg}</p>}
    </section>
  );
}

function PendingRequests({ pending, roster, refresh, cred }) {
  const pendingList = pending.filter(r => r.status !== "rejected");
  const rejectedList = pending.filter(r => r.status === "rejected")
    .sort((a,b) => new Date(b.decided_at||0) - new Date(a.decided_at||0));

  // אחרי אישור/דחייה — מציע לשלוח לשחקן הודעת וואטסאפ מוכנה, בלחיצה אחת
  const [justDecided,setJustDecided] = useState(null); // { req, decision: 'approved'|'rejected' }

  const approve = async (req, isGanigari, isVatik, group) => {
    const dupErr = findDuplicate(req.name, req.phone, req.email, roster, pending, req.id);
    if (dupErr) { window.alert("לא ניתן לאשר — " + dupErr + " בדוק אם זה אותו שחקן שנרשם בטעות פעם נוספת."); return; }
    const { data, error } = await db.rpc("approve_player_request", { input_request_id: req.id, input_is_ganigari: isGanigari, input_is_vatik: isVatik, input_group: group, input_pw: cred.pw });
    if (error) { window.alert("שגיאה באישור — נסה להתחבר שוב."); return; }
    if (data === "phone_taken") { window.alert("מספר הטלפון הזה כבר קיים במערכת."); return; }
    setJustDecided({ req, decision: "approved" });
    await refresh();
  };
  const reject = async (req) => {
    await callAdmin("reject_player_request", { input_request_id: req.id, input_pw: cred.pw });
    setJustDecided({ req, decision: "rejected" });
    await refresh();
  };
  const reconsider = async (req) => {
    await callAdmin("reconsider_player_request", { input_request_id: req.id, input_pw: cred.pw });
    await refresh();
  };
  const sendDecisionWa = () => {
    const { req, decision } = justDecided;
    const text = decision === "approved"
      ? "היי " + req.name + "! אושרת להצטרף לכדורגל גניגרי ושות' ✅ מעכשיו תוכל להירשם למשחקים באפליקציה."
      : "היי " + req.name + ", בקשת ההצטרפות שלך לכדורגל גניגרי ושות' לא אושרה הפעם. לשאלות, פנה למנהל.";
    window.open("https://wa.me/972"+req.phone.replace(/^0/,"")+"?text="+encodeURIComponent(text), "_blank");
    setJustDecided(null);
  };

  return (
    <>
      {justDecided && (
        <section style={{...S.card,...S.cardHot}}>
          <p style={S.hint}>{justDecided.decision==="approved"?"✅ "+justDecided.req.name+" אושר.":"⛔ "+justDecided.req.name+" נדחה."} לשלוח לו הודעה בוואטסאפ?</p>
          <div style={{display:"flex",gap:8,marginTop:6}}>
            <button className="btn waBtn" style={{marginTop:0}} onClick={sendDecisionWa}>📤 שלח וואטסאפ</button>
            <button className="btn small" onClick={()=>setJustDecided(null)}>לא עכשיו</button>
          </div>
        </section>
      )}
      <section style={{...S.card,...(pendingList.length?S.cardHot:{})}}>
        <h2 style={S.h2}>בקשות ממתינות {pendingList.length>0 && <span className="badgeCount">{pendingList.length}</span>}</h2>
        {pendingList.length===0 && <p style={S.hint}>אין בקשות חדשות.</p>}
        {pendingList.map(req=>(
          <PendingRequestRow key={req.id} req={req} onApprove={approve} onReject={reject} />
        ))}
      </section>

      <section style={S.card}>
        <h2 style={S.h2}>בקשות שנדחו ({rejectedList.length})</h2>
        {rejectedList.length===0 && <p style={S.hint}>אין בקשות שנדחו.</p>}
        {rejectedList.map(req=>(
          <div key={req.id} style={S.pendRow}>
            <div>
              <div style={S.pname}>{req.name}</div>
              <div style={S.subLine}>{req.phone}</div>
              {req.decided_at && <div style={S.subLine}>נדחה ב-{dateOnly(req.decided_at)}</div>}
            </div>
            <button className="btn small" onClick={()=>reconsider(req)}>שקול מחדש</button>
          </div>
        ))}
      </section>
    </>
  );
}

// שורת בקשה ממתינה — דגלי גניגרי/ותיק + קבוצה נבחרים לפני אישור, במקום
// מטריצת כפתורים קבועה (הוספת קבוצה כממד שלישי הייתה הופכת אותה ל-8

function PendingRequestRow({ req, onApprove, onReject }) {
  const [isGanigari,setIsGanigari]=useState(false);
  const [isVatik,setIsVatik]=useState(false);
  const [group,setGroup]=useState("primary");
  return (
    <div style={S.pendRow}>
      <div><div style={S.pname}>{req.name}</div><div style={S.subLine}>{req.phone}</div></div>
      <div style={S.flagRow}>
        <label style={S.flagLabel}><input type="checkbox" checked={isGanigari} onChange={e=>setIsGanigari(e.target.checked)} /> גניגרי</label>
        <label style={S.flagLabel}><input type="checkbox" checked={isVatik} onChange={e=>setIsVatik(e.target.checked)} /> ותיק</label>
        <select style={S.selectSm} value={group} onChange={e=>setGroup(e.target.value)}>
          <option value="primary">קבוצה ראשית</option>
          <option value="secondary">קבוצה משנית</option>
        </select>
      </div>
      <div style={S.pendActions}>
        <button className="btn small ok" onClick={()=>onApprove(req,isGanigari,isVatik,group)}>אשר</button>
        <button className="btn danger small" onClick={()=>onReject(req)}>דחה</button>
      </div>
    </div>
