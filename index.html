function AdminGames({ games, roster, now, refresh, cred, attendanceCounts, grades, refreshGrades }) {
  const [showNew,setShowNew]=useState(false);
  const [showOld,setShowOld]=useState(false);
  const [showHistory,setShowHistory]=useState(false);
  const [resultsHistory,setResultsHistory]=useState(null); // null = טרם נטען
  const [historyLoading,setHistoryLoading]=useState(false);
  const addGame = async (g) => {
    await callAdmin("admin_create_game", { input_kickoff: g.kickoff, input_opens_at: g.opensAt, input_visible_to_primary: g.visiblePrimary, input_visible_to_secondary: g.visibleSecondary, input_pw: cred.pw||null, input_phone: cred.phone||null, input_pin: cred.pin||null });
    setShowNew(false); await refresh();
  };
  // רשימת היסטוריית תוצאות (ר' migrations/0016) — טעינה עצלה בלחיצה, לא
  // אוטומטית (כמו ClientErrorLog), כדי לא להעמיס בקשה מיותרת בכל טעינת
  // מסך אדמין.
  const toggleHistory = async () => {
    if (showHistory) { setShowHistory(false); return; }
    setShowHistory(true);
    if (resultsHistory === null) {
      setHistoryLoading(true);
      const rows = await callAdmin("admin_get_all_game_results", { input_pw: cred.pw||null, input_phone: cred.phone||null, input_pin: cred.pin||null });
      setHistoryLoading(false);
      setResultsHistory(rows || []);
    }
  };
  const sorted = [...games].sort((a,b)=>a.kickoff-b.kickoff);
  // משחקים נעולים (נוכחות סופית, "היסטוריה") מתקפלים כברירת מחדל — לא
  // נמחקים ולא נעלמים מה-DB (attendanceCounts ב-App עדיין תלוי בהם
  // לעדיפות "מתמיד" של משחקים עתידיים), רק לא תופסים מקום במסך כברירת
  // מחדל. ר' שיחה עם המשתמש.
  const activeGames = sorted.filter(g => !g.attendanceLocked);
  const oldGames = sorted.filter(g => g.attendanceLocked);
  return (
    <section style={S.card}>
      <div style={S.rowBetween}>
        <h2 style={S.h2}>משחקים</h2>
        <button className="btn primary small" onClick={()=>setShowNew(v=>!v)}>{showNew?"בטל":"+ משחק"}</button>
      </div>
      {showNew && <NewGameForm onAdd={addGame} />}
      {activeGames.map(g=>(
        <AdminGameRow key={g.id} game={g} roster={roster} now={now} refresh={refresh} cred={cred} attendanceCounts={attendanceCounts} grades={grades} refreshGrades={refreshGrades} />
      ))}
      {oldGames.length>0 && (
        <>
          <button className="btn small" style={{marginTop:10,width:"100%"}} onClick={()=>setShowOld(v=>!v)}>
            משחקים קודמים ונעולים ({oldGames.length}) {showOld?"▲":"▼"}
          </button>
          {showOld && oldGames.map(g=>(
            <AdminGameRow key={g.id} game={g} roster={roster} now={now} refresh={refresh} cred={cred} attendanceCounts={attendanceCounts} grades={grades} refreshGrades={refreshGrades} />
          ))}
        </>
      )}
      <button className="btn small" style={{marginTop:10,width:"100%"}} onClick={toggleHistory}>
        📜 היסטוריית תוצאות {showHistory?"▲":"▼"}
      </button>
      {showHistory && historyLoading && <div style={{...S.subLine,marginTop:8,textAlign:"center"}}>טוען…</div>}
      {showHistory && !historyLoading && resultsHistory && (
        resultsHistory.length === 0 ? (
          <div style={{...S.subLine,marginTop:8,textAlign:"center"}}>אין עדיין תוצאות מתועדות</div>
        ) : resultsHistory.map(r => {
          const dotColor = r.team1_score > r.team2_score ? "#f97316" : r.team2_score > r.team1_score ? "#3b82f6" : "#9ca3af";
          const count = Number(r.team1_count) + Number(r.team2_count);
          return (
            <div key={r.game_id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 4px",borderBottom:"1px solid #eee"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:dotColor}}></span>
                <b>{r.team1_score} - {r.team2_score}</b>
                <span style={S.subLine}>{count} שחקנים</span>
              </div>
              <span style={S.subLine}>{dateOnly(r.kickoff)}</span>
            </div>
          );
        })
      )}
    </section>
  );
}

function NewGameForm({ onAdd }) {
  const [kickoff,setKickoff]=useState(""); const [opensAt,setOpensAt]=useState("");
  const [visPrimary,setVisPrimary]=useState(true); const [visSecondary,setVisSecondary]=useState(false);
  // ברירת מחדל: יומיים לפני המשחק, בשעה 21:00 קבועה — בלי קשר לשעת
  // המשחק עצמו (למשל משחק ביום ב' 20:00 → פתיחה בשבת 21:00; משחק ביום
  // ו' 15:15 → פתיחה ביום ד' 21:00). ר' שיחה עם המשתמש.
  useEffect(()=>{ if(kickoff&&!opensAt){ const d=new Date(kickoff); d.setDate(d.getDate()-2); d.setHours(21,0,0,0); setOpensAt(toLocalInput(d)); } },[kickoff]);
  return (
    <div style={S.formBox}>
      <label style={S.labelSm}>מועד המשחק</label>
      <input style={S.input} type="datetime-local" value={kickoff} onChange={e=>setKickoff(e.target.value)} />
      <label style={S.labelSm}>פתיחת הרשמה</label>
      <input style={S.input} type="datetime-local" value={opensAt} onChange={e=>setOpensAt(e.target.value)} />
      <label style={{...S.labelSm,marginTop:10}}>מי רואה את המשחק</label>
      <div style={S.flagRow}>
        <label style={S.flagLabel}><input type="checkbox" checked={visPrimary} onChange={e=>setVisPrimary(e.target.checked)} /> קבוצה ראשית</label>
        <label style={S.flagLabel}><input type="checkbox" checked={visSecondary} onChange={e=>setVisSecondary(e.target.checked)} /> קבוצה משנית</label>
      </div>
      <button className="btn primary" style={{marginTop:8}} disabled={!kickoff||!opensAt} onClick={()=>onAdd({kickoff:new Date(kickoff).getTime(),opensAt:new Date(opensAt).getTime(),visiblePrimary:visPrimary,visibleSecondary:visSecondary})}>צור משחק (טיוטה)</button>
    </div>
  );
}

function AdminGameRow({ game, roster, now, refresh, cred, attendanceCounts, grades, refreshGrades }) {
  const sorted = sortRegs(game.registrations.map(r=>({player_id:r.playerId,ts:r.ts,attended:r.attended,guest_name:r.guestName})), roster, attendanceCounts);
  const main = sorted.slice(0,MAX_PLAYERS), wait = sorted.slice(MAX_PLAYERS);
  const nameOf = id => (roster.find(r=>r.id===id)||{}).name || "—";
  const displayName = r => r.guest_name ? (r.guest_name+" (אורח)") : nameOf(r.player_id);
  const [addId,setAddId]=useState("");
  const [guestName,setGuestName]=useState("");
  const [guestGrade,setGuestGrade]=useState("");
  const [copiedMsg,setCopiedMsg]=useState("");
  const [editingKickoff,setEditingKickoff]=useState(false);
  const [newKickoff,setNewKickoff]=useState("");
  const [showSecondarySend,setShowSecondarySend]=useState(false);
  const [showTeamSplit,setShowTeamSplit]=useState(false);
  const [teamSplit,setTeamSplit]=useState(null); // {team1:[{id,name,grade}], team2:[...]}
  const [teamsLoading,setTeamsLoading]=useState(false);
  const [sharingTeams,setSharingTeams]=useState(false);
  const [gameResult,setGameResult]=useState(null); // {team1Score,team2Score} | null — ר' migrations/0016
  const [score1,setScore1]=useState(""); const [score2,setScore2]=useState("");
  const [savingResult,setSavingResult]=useState(false);
  const [playerForm,setPlayerForm]=useState({}); // player_id -> ["win"|"loss"|"draw", ...] (5 אחרונים, חדש→ישן) — ר' migrations/0017
  const teamCardRef = useRef(null);
  const isOpen = now >= game.opensAt;
  const hasHappened = now >= game.kickoff;
  const credArgs = { input_pw: cred.pw||null, input_phone: cred.phone||null, input_pin: cred.pin||null };

  const setGameField = async (patch) => {
    if ("published" in patch) await callAdmin("admin_set_game_published", { input_game_id: game.id, input_published: patch.published, ...credArgs });
    if ("roster_published" in patch) await callAdmin("admin_set_roster_published", { input_game_id: game.id, input_roster_published: patch.roster_published, ...credArgs });
    if ("visible_to_primary" in patch) await callAdmin("admin_set_game_visible_primary", { input_game_id: game.id, input_value: patch.visible_to_primary, ...credArgs });
    if ("visible_to_secondary" in patch) await callAdmin("admin_set_game_visible_secondary", { input_game_id: game.id, input_value: patch.visible_to_secondary, ...credArgs });
    if ("registration_closed" in patch) await callAdmin("admin_set_registration_closed", { input_game_id: game.id, input_value: patch.registration_closed, ...credArgs });
    await refresh();
  };
  const removeReg = async (pid, name) => {
    if (!window.confirm("להסיר את " + name + " מרשימת המשתתפים למשחק הזה?")) return;
    await callAdmin("admin_remove_registration", { input_game_id: game.id, input_player_id: pid, ...credArgs }); await refresh();
  };
  const addReg = async () => {
    if (!addId || game.registrations.some(r=>r.playerId===addId)) return;
    await callAdmin("admin_add_registration", { input_game_id: game.id, input_player_id: addId, ...credArgs });
    setAddId(""); await refresh();
  };
  // אורח חד-פעמי — לא נוצרת עבורו שורה ב-players, רק שורת הרשמה למשחק הזה
  // בלבד (ר' admin_add_guest_registration, migrations/0008). דירוג אופציונלי
  // (ר' migrations/0015) — בלי זה הוא יקבל 50 ברירת מחדל בפאנל החלוקה, כמו
  // כל אחד אחר שלא דורג; שדה ריק/לא תקין = לא נשלח דירוג בכלל (null).
  const addGuest = async () => {
    const n = guestName.trim();
    if (!n) return;
    const g = parseInt(guestGrade, 10);
    const inputGrade = (guestGrade.trim() !== "" && Number.isFinite(g) && g >= 1 && g <= 99) ? g : null;
    await callAdmin("admin_add_guest_registration", { input_game_id: game.id, input_guest_name: n, input_grade: inputGrade, ...credArgs });
    setGuestName(""); setGuestGrade(""); await refresh(); await refreshGrades();
  };
  const deleteGame = async () => {
    if (!window.confirm("למחוק את המשחק " + dayName(game.kickoff) + " " + dateOnly(game.kickoff) + "? הפעולה תמחק גם את כל ההרשמות שלו, ולא ניתנת לביטול.")) return;
    await callAdmin("admin_delete_game", { input_game_id: game.id, ...credArgs }); await refresh();
  };
  const startEditKickoff = () => { setNewKickoff(toLocalInput(new Date(game.kickoff))); setEditingKickoff(true); };
  // משנה רק את השעה/תאריך של המשחק עצמו — כל מקום שמציג אותו לשחקנים
  // (כרטיס, באנר, הודעות וואטסאפ) קורא ישירות מ-game.kickoff, אז השינוי
  // מתעדכן בכל מקום אוטומטית, בלי עותקים נפרדים לסנכרן.
  const saveKickoff = async () => {
    if (!newKickoff) return;
    const newTs = new Date(newKickoff).getTime();
    if (!window.confirm("לשנות את שעת המשחק ל-"+dayName(newTs)+" "+fmtTime(newTs)+"? כל השחקנים יראו את השעה המעודכנת.")) return;
    await callAdmin("admin_set_game_kickoff", { input_game_id: game.id, input_kickoff: newTs, ...credArgs });
    setEditingKickoff(false); await refresh();
  };
  const setAttendance = async (pid, attended) => {
    if (game.attendanceLocked) return;
    await callAdmin("admin_set_attendance", { input_game_id: game.id, input_player_id: pid, input_attended: attended, ...credArgs });
    await refresh();
  };
  const markAllAttended = async () => {
    if (game.attendanceLocked) return;
    await Promise.all(main.map(r => callAdmin("admin_set_attendance", { input_game_id: game.id, input_player_id: r.player_id, input_attended: true, ...credArgs })));
    await refresh();
  };
  const setAttendanceLocked = async (locked) => {
    await callAdmin("admin_set_attendance_locked", { input_game_id: game.id, input_locked: locked, ...credArgs });
    await refresh();
  };
  const bump = async (pid, dir) => {
    const idx = sorted.findIndex(r=>r.player_id===pid);
    const swapWith = sorted[idx+dir]; if(!swapWith) return;
    await callAdmin("admin_set_registration_ts", { input_game_id: game.id, input_player_id: pid, input_ts: swapWith.ts - dir, ...credArgs });
    await refresh();
  };
  const buildWa = () => {
    const lines=["⚽ כדורגל גניגרי ושות'", "משחק "+dayName(game.kickoff)+" · "+fmtDateTime(game.kickoff), "", "משתתפים ("+main.length+"/"+MAX_PLAYERS+"):"];
    main.forEach((r,i)=>lines.push((i+1)+". "+displayName(r)));
    if (wait.length>0){ lines.push(""); lines.push("רשימת המתנה ("+wait.length+"):"); wait.forEach((r,i)=>lines.push((i+1)+". "+displayName(r))); }
    return lines.join("\n");
  };
  const shareWa = () => window.open("https://wa.me/?text="+encodeURIComponent(buildWa()), "_blank");

  // הודעת "נפתחה ההרשמה" לקבוצת הוואטסאפ של הקבוצה הראשית — אותו דפוס
  // בדיוק כמו shareWa (wa.me בלי מספר, האדמין בוחר יעד ולוחץ שלח בעצמו)
  const buildOpenMsg = () => "נפתחה ההרשמה למשחק הכדורגל ב"+dayName(game.kickoff)+" בשעה "+fmtTime(game.kickoff)+", במגרש גילעד ⚽\nיש לאשר הגעה באפליקציה: "+APP_URL;
  const shareOpenMsg = () => window.open("https://wa.me/?text="+encodeURIComponent(buildOpenMsg()), "_blank");

  // לקבוצה המשנית (כמה חברים בודדים, בלי קבוצת וואטסאפ משלהם) אין יעד
  // משותף אחד לשלוח אליו — wa.me בלי מספר תמיד פותח בורר "כל אנשי הקשר",
  // לא רשימה מסוננת. הפתרון בפועל: כפתור שליחה נפרד לכל שחקן בקבוצה
  // המשנית, לפי הדפוס הקיים באפליקציה לשליחה לטלפון ספציפי (ר' shareWa
  // ב-AdminInvites/AdminPinResets) — כל כפתור פותח צ'אט וואטסאפ מוכן מראש
  // עם אותו שחקן, והאדמין לוחץ "שלח" פעם אחת לכל שם. אין דרך לשלוח את כולם
  // בלחיצה אחת אמיתית בלי WhatsApp Business API בתשלום.
  const secondaryMembers = roster.filter(p => p.player_group==="secondary" && p.phone);
  // סימון "נשלח" לכל שחקן, לפי משחק — כדי שלא ישלחו בטעות הודעה כפולה
  // לאותו אדם (למשל לחיצה כפולה, או חזרה לרשימה אחרי כמה דקות ושכחה
  // שכבר נשלח). ב-localStorage כי זה רק תזכורת UI, לא נתון עסקי שצריך
  // לשרוד בין מכשירים — כל אדמין רואה את מה שהוא עצמו כבר שלח במכשיר הזה.
  const sentKey = (pid) => "waSent_"+game.id+"_"+pid;
  const [sentIds,setSentIds] = useState(() => {
    const s = new Set();
    try { secondaryMembers.forEach(p => { if (localStorage.getItem(sentKey(p.id))) s.add(p.id); }); } catch {}
    return s;
  });
  const sendOpenMsgTo = (p) => {
    if (sentIds.has(p.id) && !window.confirm("כבר נשלחה הודעה ל"+p.name+" למשחק הזה. לשלוח שוב?")) return;
    window.open("https://wa.me/972"+p.phone.replace(/^0/,"")+"?text="+encodeURIComponent(buildOpenMsg()), "_blank");
    try { localStorage.setItem(sentKey(p.id), "1"); } catch {}
    setSentIds(prev => new Set(prev).add(p.id));
  };

  // פורמט של לוג צ'אט וואטסאפ ([D/M, HH:MM] שם: מגיע) — לא לשליחה, אלא להעתקה
  // כדי שאפליקציה חיצונית אחרת שמזהה נוכחות לפי הפורמט הזה תוכל לקלוט את הרשימה
  const buildWaLog = () => main.map(r => {
    const d = new Date(r.ts);
    const dateStr = (d.getMonth()+1)+"/"+d.getDate();
    const timeStr = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    return "["+dateStr+", "+timeStr+"] "+displayName(r)+": מגיע";
  }).join("\n");
  const copyWaLog = async () => {
    const text = buildWaLog();
    try { await navigator.clipboard.writeText(text); setCopiedMsg("הועתק ללוח! ✓"); }
    catch { window.prompt("העתק ידנית (Ctrl+C):", text); setCopiedMsg(""); }
    setTimeout(()=>setCopiedMsg(""), 2500);
  };

  // חלוקת כוחות (ר' migrations/0013, שלב A) — דירוג בלבד, בלי כימיה/היסטוריה
  // (אלה שלב עתידי, תלוי בייבוא נתונים אמיתי מאפליקציה חיצונית). פועלת
  // רק על main (לא waitlist) — אורחים ושחקנים בלי דירוג מפורש מקבלים 50
  // (ברירת המחדל הניטרלית, זהה לערך שה-RPC דוחף לשחקן חדש).
  // שם רגיל, בלי "(אורח)" — התיוג הזה שימושי ברשימת המשתתפים הרגילה
  // (displayName) אבל מיותר כאן: בפאנל החלוקה ובכרטיס השיתוף זה פרטי
  // מידע לאדמין בלבד, לא רלוונטי מי אורח ומי לא (ר' שיחה עם המשתמש).
  const eligibleForSplit = main.map(r => ({ id: r.player_id, name: r.guest_name || nameOf(r.player_id), grade: grades[r.player_id] || 50 }));
  // השיבוץ השמור (אם יש) חי בטבלה נעולה (game_teams, ר' migrations/0014)
  // ולכן נטען רק כאן, בפתיחה, דרך RPC אדמין — לא מגיע עם שאר נתוני המשחק.
  const openTeamSplit = async () => {
    setShowTeamSplit(true);
    setTeamsLoading(true);
    // התוצאה (אם יש) נטענת יחד עם השיבוץ — אותה קריאת פתיחה, אותו מצב טעינה
    // (ר' migrations/0016, admin_get_game_result)
    // פורמה (5 תוצאות אחרונות לכל שחקן, ר' migrations/0017) נטענת באותה
    // קריאת פתיחה — נגזרת מ-game_teams/game_results הקיימים, בלי טבלה חדשה.
    const [saved, result, form] = await Promise.all([
      callAdmin("admin_get_game_teams", { input_game_id: game.id, ...credArgs }),
      callAdmin("admin_get_game_result", { input_game_id: game.id, ...credArgs }),
      callAdmin("admin_get_player_form", { input_player_ids: eligibleForSplit.map(e=>e.id), ...credArgs }),
    ]);
    setTeamsLoading(false);
    const savedRows = saved || [];
    if (savedRows.length > 0) {
      const team1Ids = new Set(savedRows.filter(r=>r.team===1).map(r=>r.player_id));
      const team2Ids = new Set(savedRows.filter(r=>r.team===2).map(r=>r.player_id));
      setTeamSplit({ team1: eligibleForSplit.filter(e=>team1Ids.has(e.id)), team2: eligibleForSplit.filter(e=>team2Ids.has(e.id)) });
    } else {
      setTeamSplit(splitTeamsByGrade(eligibleForSplit));
    }
    const resultRow = (result||[])[0];
    if (resultRow) {
      setGameResult(resultRow);
      setScore1(String(resultRow.team1_score)); setScore2(String(resultRow.team2_score));
    } else {
      setGameResult(null); setScore1(""); setScore2("");
    }
    const formMap = {};
    (form||[]).forEach(row => { (formMap[row.player_id] = formMap[row.player_id] || []).push(row.outcome); });
    setPlayerForm(formMap);
  };
  const saveResult = async () => {
    const s1 = parseInt(score1,10), s2 = parseInt(score2,10);
    if (!Number.isFinite(s1) || !Number.isFinite(s2) || s1<0 || s2<0) return;
    setSavingResult(true);
    const ok = await callAdmin("admin_set_game_result", { input_game_id: game.id, input_team1_score: s1, input_team2_score: s2, ...credArgs });
    setSavingResult(false);
    if (ok) setGameResult({ team1_score: s1, team2_score: s2 });
  };
  const reshuffleTeams = () => setTeamSplit(splitTeamsByGrade(eligibleForSplit));
  const swapPlayer = (id, fromTeam) => {
    setTeamSplit(prev => {
      if (!prev) return prev;
      if (fromTeam === 1) {
        const player = prev.team1.find(p=>p.id===id);
        return { team1: prev.team1.filter(p=>p.id!==id), team2: [...prev.team2, player] };
      }
      const player = prev.team2.find(p=>p.id===id);
      return { team1: [...prev.team1, player], team2: prev.team2.filter(p=>p.id!==id) };
    });
  };
  const saveTeamSplit = async () => {
    if (!teamSplit) return;
    await callAdmin("admin_set_game_teams", { input_game_id: game.id, input_team1_ids: teamSplit.team1.map(p=>p.id), input_team2_ids: teamSplit.team2.map(p=>p.id), ...credArgs });
    await refresh();
  };

  // שיתוף תמונה (לא טקסט) של החלוקה, בלי שום ציון/דירוג — זה גלוי רק
  // באפליקציה לעיני האדמין (ר' teamCardRef, הכרטיס המוסתר למטה). מצלם
  // את הכרטיס ל-PNG (html2canvas), ומשתף אותו דרך Web Share API (עם
  // קבצים — נתמך היטב בדפדפני מובייל). בלי תמיכה — נופל חזרה להורדת
  // הקובץ + הנחיה לצרף ידנית, אותה רוח כמו ה-fallback של copyWaLog.
  const downloadTeamCard = (blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "חלוקת-כוחות.png"; a.click();
    URL.revokeObjectURL(url);
    window.alert("התמונה הורדה — אפשר לצרף אותה ידנית בוואטסאפ.");
  };
  const shareTeamsImage = async () => {
    if (!teamSplit || !teamCardRef.current || typeof html2canvas === "undefined") return;
    setSharingTeams(true);
    try {
      // שומר את החלוקה לפני השיתוף (לא רק אחרי לחיצה נפרדת על "שמור
      // חלוקה") — כך שגם אם הדפדפן נטען מחדש בחזרה מתפריט השיתוף של
      // וואטסאפ (קורה בפועל בחלק מהדפדפנים במובייל), פתיחת הפאנל מחדש
      // תטען בחזרה בדיוק את אותה חלוקה, במקום שהיא "תיעלם". ר' שיחה עם המשתמש.
      await saveTeamSplit();
      const canvas = await html2canvas(teamCardRef.current, { backgroundColor: "#ffffff", scale: 2 });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) { setSharingTeams(false); return; }
      const file = new File([blob], "חלוקת-כוחות.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "חלוקת כוחות" }); }
        catch (e) { if (e && e.name !== "AbortError") downloadTeamCard(blob); }
      } else {
        downloadTeamCard(blob);
      }
    } catch (e) {
      logClientError(e.message, e.stack, "shareTeamsImage");
      window.alert("יצירת התמונה נכשלה — נסה שוב.");
    }
    setSharingTeams(false);
  };

  // נקודות "פורמה" — 5 תוצאות אחרונות (חדש→ישן), ניצחון=ירוק/הפסד=אדום/
  // תיקו=כחול (ר' migrations/0017, שיחה עם המשתמש). ריק אם אין עדיין היסטוריה.
  const formDots = (pid) => {
    const outcomes = playerForm[pid] || [];
    const color = o => o==="win" ? "#22c55e" : o==="loss" ? "#ef4444" : "#3b82f6";
    return (
      <span style={{display:"inline-flex",gap:3,flexShrink:0}}>
        {outcomes.map((o,i) => <span key={i} style={{width:7,height:7,borderRadius:"50%",background:color(o)}} />)}
      </span>
    );
  };

  return (
    <div style={S.adminGame}>
      <div style={S.rowBetween}>

      {teamSplit && (

                {teamSplit.team1.map((p,i)=>(

            <div style={S.teamCardFooterRow}>
              <div style={{...S.teamCardFooter,background:"#dbeafe",color:"#1e3a8a"}}>{teamSplit.team1.length} שחקנים</div>

      <div style={S.addRow}>
        <select style={S.selectSm} value={addId} onChange={e=>setAddId(e.target.value)}>
          <option value="">+ הוסף שחקן ידנית…</option>
          {roster.filter(p=>!game.registrations.some(r=>r.playerId===p.id)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <button className="btn small" onClick={addReg} disabled={!addId}>הוסף</button>
      </div>
      <div style={S.addRow}>
        <input style={S.selectSm} placeholder="שם אורח…" value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGuest()} />
        <input style={{...S.input,width:56,padding:6}} type="number" min="1" max="99" placeholder="50" value={guestGrade} onChange={e=>setGuestGrade(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGuest()} title="דירוג לאורח (אופציונלי, לחלוקת כוחות)" />
        <button className="btn small" onClick={addGuest} disabled={!guestName.trim()}>+ הוסף אורח</button>
      </div>
      <div style={game.attendanceLocked?S.pubBarOn:S.pubBar}>
        <span style={S.pubText}>{game.attendanceLocked?("🔒 נוכחות נעולה — משחק "+dayName(game.kickoff)+" "+dateOnly(game.kickoff)+". ספירת ההגעות המצטברת כוללת אותו."):"נוכחות פתוחה לעריכה — עדיין לא נספר בעדיפות, עד שתנעל"}</span>
        <button className={game.attendanceLocked?"btn small":"btn primary small"} onClick={()=>setAttendanceLocked(!game.attendanceLocked)}>{game.attendanceLocked?"🔓 פתח לעריכה":"🔒 נעל משחק"}</button>
      </div>
      {(game.declines||[]).length > 0 && (
        <div style={S.declineSummary}>❌ לא מגיעים ({game.declines.length}): {game.declines.map(d=>nameOf(d.playerId)).join(", ")}</div>
      )}
      <div style={S.adminList}>
        <div style={S.rowBetween}>
          <div style={S.listTitle}>משתתפים ({main.length}/{MAX_PLAYERS})</div>

        </div>
        <p style={{...S.hint,fontSize:12,marginTop:-4}}>אחרי המשחק — סמן הכל, בטל ✓ למי שלא הגיע בפועל, ואז נעל את המשחק.</p>
        {main.map((r,i)=><EditableRow key={r.player_id} i={i+1} name={displayName(r)} attended={r.attended} locked={game.attendanceLocked} onToggleAttended={()=>setAttendance(r.player_id, !r.attended)} onUp={()=>bump(r.player_id,-1)} onDown={()=>bump(r.player_id,1)} onRemove={()=>removeReg(r.player_id, displayName(r))} />)}
        {main.length===0 && <div style={S.liEmpty}>אין נרשמים</div>}
        {wait.length>0 && (
          <>
            <div style={{...S.listTitle,color:"#b45309",marginTop:10}}>רשימת המתנה ({wait.length})</div>
            {wait.map((r,i)=><EditableRow key={r.player_id} i={i+1} wait name={displayName(r)} attended={r.attended} locked={game.attendanceLocked} onToggleAttended={()=>setAttendance(r.player_id, !r.attended)} onUp={()=>bump(r.player_id,-1)} onDown={()=>bump(r.player_id,1)} onRemove={()=>removeReg(r.player_id, displayName(r))} />)}

function EditableRow({ i, name, onUp, onDown, onRemove, wait, attended, onToggleAttended, locked }) {
  return (
    <div style={wait?S.editRowWait:S.editRow}>
      <span style={S.num}>{i}</span><span style={S.pname}>{name}</span>
      <div style={{display:"flex",gap:4}}>
        <button className={attended?"mini ok":"mini"} title={locked?"נעול — פתח את המשחק כדי לשנות":"הגיע בפועל"} onClick={onToggleAttended} disabled={locked}>✓</button>
        <button className="mini" onClick={onUp}>▲</button>
        <button className="mini" onClick={onDown}>▼</button>
        <button className="mini danger" onClick={onRemove}>✕</button>
      </div>
    </div>
  );
}

function AdminRoster({ roster, admins, refresh, cred, attendanceCounts, grades, refreshGrades }) {
  const [search,setSearch]=useState("");
  const [name,setName]=useState(""); const [phone,setPhone]=useState("");
  const [newGanigari,setNewGanigari]=useState(false); const [newVatik,setNewVatik]=useState(false);
  const [newGroup,setNewGroup]=useState("primary");
  const [err,setErr]=useState("");

  const add = async () => {
    setErr("");
    if (!validName(name)) { setErr("נא להזין שם פרטי ושם משפחה"); return; }
    if (!validPhone(phone)) { setErr("טלפון לא תקין"); return; }
    const p = normPhone(phone);
    if (roster.some(r=>r.phone===p)) { setErr("מספר קיים כבר ברשימה"); return; }
    const nn = normName(name);
    if (roster.some(r=>normName(r.name)===nn)) { setErr("שם זה כבר קיים ברשימה"); return; }
    const data = await callAdmin("admin_add_player", { input_name: name.trim(), input_phone: p, input_is_ganigari: newGanigari, input_is_vatik: newVatik, input_group: newGroup, input_pw: cred.pw });
    if (data === "phone_taken") { setErr("מספר קיים כבר ברשימה"); return; }
    setName(""); setPhone(""); setNewGanigari(false); setNewVatik(false); setNewGroup("primary"); await refresh();
  };
  const toggleFlag = async (id, field, val) => {
    const rpc = field === "is_ganigari" ? "admin_set_player_ganigari" : "admin_set_player_vatik";
    await callAdmin(rpc, { input_player_id: id, input_value: val, input_pw: cred.pw });
    await refresh();
  };
  const setGroup = async (id, group) => {
    await callAdmin("admin_set_player_group", { input_player_id: id, input_group: group, input_pw: cred.pw });
    await refresh();
  };
  // דירוג מספרי לחלוקת כוחות (ר' migrations/0013, שלב A) — מוזן ידנית
  // בלבד, אין עדכון אוטומטי לפי תוצאות (אין עדיין היסטוריית תוצאות).
  const setGrade = async (id, newGradeRaw, otherErrSetter) => {
    const g = parseInt(newGradeRaw, 10);
    if (!Number.isFinite(g) || g < 1 || g > 99) { otherErrSetter("דירוג חייב להיות מספר בין 1 ל-99"); return false; }
    await callAdmin("admin_set_player_grade", { input_player_id: id, input_grade: g, input_pw: cred.pw });
    await refreshGrades();
    return true;
  };
  const remove = async (id, name) => {
    if (!window.confirm("להסיר את " + name + " מרשימת השחקנים? הפעולה תמחק גם את כל ההרשמות שלו למשחקים, ולא ניתנת לביטול.")) return;
    await callAdmin("admin_delete_player", { input_player_id: id, input_pw: cred.pw });
    await refresh();
  };
  const updateName = async (id, newNameRaw, otherErrSetter) => {
    if (!validName(newNameRaw)) { otherErrSetter("נא להזין שם פרטי ושם משפחה"); return false; }
    const nn = normName(newNameRaw);
    if (roster.some(r=>r.id!==id && normName(r.name)===nn)) { otherErrSetter("השם הזה כבר שייך לשחקן אחר"); return false; }
    await callAdmin("admin_update_player_name", { input_player_id: id, input_name: newNameRaw.trim(), input_pw: cred.pw });
    await refresh();
    return true;
  };
  const updatePhone = async (id, newPhoneRaw, otherErrSetter) => {
    if (!validPhone(newPhoneRaw)) { otherErrSetter("טלפון לא תקין"); return false; }
    const np = normPhone(newPhoneRaw);
    if (roster.some(r=>r.id!==id && r.phone===np)) { otherErrSetter("המספר הזה כבר שייך לשחקן אחר"); return false; }
    const data = await callAdmin("admin_update_player_phone", { input_player_id: id, input_phone: np, input_pw: cred.pw });
    if (data === "phone_taken") { otherErrSetter("המספר הזה כבר שייך לשחקן אחר"); return false; }
    await refresh();
    return true;
  };
  // עדכון מייל לשחקן קיים — למשל כששחקן מודיע שהוא עבר למייל חדש. בפעם הבאה
  // שהוא יאמת עם המייל החדש, המערכת תקשר אותו אוטומטית לרשומה הקיימת שלו
  // (בלי ליצור בקשה חדשה ובלי לדרוש אישור נוסף) — ראו submit_player_request.
  const updateEmail = async (id, newEmailRaw, otherErrSetter) => {
    if (!validEmail(newEmailRaw)) { otherErrSetter("כתובת מייל לא תקינה"); return false; }
    const ne = newEmailRaw.trim();
    if (roster.some(r=>r.id!==id && sameEmail(r.email, ne))) { otherErrSetter("המייל הזה כבר שייך לשחקן אחר"); return false; }
    await callAdmin("admin_update_player_email", { input_player_id: id, input_email: ne, input_pw: cred.pw });
    await refresh();
    return true;
  };

  const rankOf = p => (p.is_ganigari && p.is_vatik) ? 4 : p.is_ganigari ? 3 : p.is_vatik ? 2 : 1;
  const sorted = [...roster].sort((a,b) => rankOf(b) - rankOf(a));
  // מסנן תצוגה בלבד — exportExcel/shareRosterWa ממשיכים לעבוד על כל הרשימה
  // (sorted), לא על מה שמסונן כרגע בחיפוש. המספור נשאר לפי המיקום המקורי
  // ברשימה המלאה (לא ממוספר מחדש לפי תוצאות החיפוש).
  const q = normName(search);
  const filtered = sorted.map((p,i)=>({p,i})).filter(({p}) => !q || normName(p.name).includes(q));

  const statusLabel = p => {
    if (p.is_ganigari && p.is_vatik) return "גניגרי + ותיק";
    if (p.is_ganigari) return "גניגרי";
    if (p.is_vatik) return "ותיק";
    return "רגיל";
  };
  const statusClass = p => (p.is_ganigari && p.is_vatik) ? "badge gv" : p.is_ganigari ? "badge g" : p.is_vatik ? "badge v" : "badge r";

  const exportExcel = () => {
    const rows = sorted.map((p,i) => ({
      "#": i+1,
      "שם": p.name,
      "טלפון": p.phone,
      "מייל": p.email || "",
      "סטטוס": statusLabel(p),
      "מספר הגעות": (attendanceCounts && attendanceCounts[p.id]) || 0,
      "מנהל": admins.some(a=>a.phone===p.phone) ? "כן" : "לא",
      "תאריך אישור": p.approved_at ? dateOnly(p.approved_at) : "",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "שחקנים");
    XLSX.writeFile(wb, "שחקנים מאושרים.xlsx");
  };

  const shareRosterWa = () => {
    const lines = ["⚽ כדורגל גניגרי ושות'", "רשימת שחקנים מאושרים ("+sorted.length+"):", ""];
    sorted.forEach((p,i) => lines.push((i+1)+". "+p.name));
    window.open("https://wa.me/?text="+encodeURIComponent(lines.join("\n")), "_blank");
  };

  return (
    <section style={S.card}>
      <div style={S.rowBetween}>
        <h2 style={S.h2}>שחקנים מאושרים ({roster.length})</h2>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button className="btn small" onClick={exportExcel}>📥 ייצוא לאקסל</button>
          <button className="btn small" onClick={shareRosterWa}>💬 שלח לוואטסאפ</button>
        </div>
      </div>
      <p style={S.hint}>עדיפות: גניגרי+ותיק (גבוהה ביותר) ← גניגרי ← ותיק ← רגיל. שחקן יכול להיות גם גניגרי וגם ותיק בו-זמנית.</p>

      <div style={S.formBox}>
        <input style={S.input} placeholder="שם פרטי ושם משפחה" value={name} onChange={e=>setName(e.target.value)} />
        <input style={{...S.input,marginTop:8}} placeholder="טלפון 0501234567" value={phone} inputMode="tel" onChange={e=>setPhone(e.target.value)} />
        <div style={S.flagRow}>
          <label style={S.flagLabel}><input type="checkbox" checked={newGanigari} onChange={e=>setNewGanigari(e.target.checked)} /> גניגרי</label>
          <label style={S.flagLabel}><input type="checkbox" checked={newVatik} onChange={e=>setNewVatik(e.target.checked)} /> ותיק</label>
          <select style={S.selectSm} value={newGroup} onChange={e=>setNewGroup(e.target.value)}>
            <option value="primary">קבוצה ראשית</option>
            <option value="secondary">קבוצה משנית</option>
          </select>
          <button className="btn primary small" onClick={add}>הוסף</button>
        </div>
        {err && <p style={S.errText}>{err}</p>}
      </div>

      <div style={{display:"flex",gap:8,marginTop:12}}>
        <input style={S.input} placeholder="🔍 חיפוש לפי שם…" value={search} onChange={e=>setSearch(e.target.value)} />
        {search && <button className="btn small" onClick={()=>setSearch("")}>נקה ✕</button>}
      </div>
      {q && filtered.length===0 && <p style={S.hint}>לא נמצאו שחקנים.</p>}

      <div style={S.rosterGrid}>
        {filtered.map(({p,i})=>{
          const isAdmin = admins.some(a=>a.phone===p.phone);
          return (
            <div key={p.id} style={S.rosterCard}>
              <div style={S.rosterRow}>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={S.num}>{i+1}</span>
                    <NameEditor player={p} onSave={updateName} />
                  </div>
                  <PhoneEditor player={p} onSave={updatePhone} />
                  <EmailEditor player={p} onSave={updateEmail} />
                  {p.approved_at && <div style={S.subLine}>אושר ב-{dateOnly(p.approved_at)}</div>}
                  <div style={{marginTop:4,display:"flex",gap:6,flexWrap:"wrap"}}>
                    <span className={statusClass(p)}>{statusLabel(p)}</span>
                    {isAdmin && <span className="badge a">מנהל</span>}
                    <span className="badge r">{(attendanceCounts && attendanceCounts[p.id]) || 0} הגעות</span>
                  </div>
                </div>
                <button className="mini danger" onClick={()=>remove(p.id, p.name)}>✕</button>
              </div>
              <div style={S.flagRow}>
                <label style={S.flagLabel}><input type="checkbox" checked={!!p.is_ganigari} onChange={e=>toggleFlag(p.id,"is_ganigari",e.target.checked)} /> גניגרי</label>
                <label style={S.flagLabel}><input type="checkbox" checked={!!p.is_vatik} onChange={e=>toggleFlag(p.id,"is_vatik",e.target.checked)} /> ותיק</label>
                <select style={S.selectSm} value={p.player_group||"primary"} onChange={e=>setGroup(p.id,e.target.value)}>
                  <option value="primary">קבוצה ראשית</option>
                  <option value="secondary">קבוצה משנית</option>
                </select>
              </div>
              <GradeEditor player={p} grade={grades[p.id] ?? 50} onSave={setGrade} />
            </div>
          );
        })}
      </div>
    </section>
  );
}

// עריכת שם בשורה — לשימוש כששחקן מודיע על שינוי שם (למשל שם משפחה)
function NameEditor({ player, onSave }) {
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(player.name);
  const [err,setErr]=useState("");

  if (!editing) {
    return (
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <div style={S.pname}>{player.name}</div>
        <span style={{...S.linkText,fontSize:12}} onClick={()=>{setVal(player.name); setErr(""); setEditing(true);}}>שנה שם</span>
      </div>
    );
  }
  const save = async () => {
    setErr("");
    const ok = await onSave(player.id, val, setErr);
    if (ok) setEditing(false);
  };
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2,flexWrap:"wrap"}}>
      <input style={{...S.input,width:190,padding:6}} value={val} onChange={e=>setVal(e.target.value)} placeholder="שם פרטי ושם משפחה" />
      <button className="btn small" onClick={save}>שמור</button>
      <button className="btn small" onClick={()=>setEditing(false)}>בטל</button>
      {err && <span style={{...S.errText,marginTop:0}}>{err}</span>}
    </div>
  );
}

// עריכת דירוג שחקן לחלוקת כוחות (ר' migrations/0013/0014) — נראה רק
// באדמין, לא נחשף לשחקנים בשום מקום (ר' AdminGameRow, פאנל החלוקה). הערך

// פומבית) — נטען בנפרד דרך admin_get_player_grades (ר' AdminView).
function GradeEditor({ player, grade, onSave }) {
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(grade);
  const [err,setErr]=useState("");

  if (!editing) {
    return (
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>

        <span style={{...S.linkText,fontSize:12}} onClick={()=>{setVal(grade); setErr(""); setEditing(true);}}>שנה דירוג</span>
      </div>
    );
  }
  const save = async () => {
    setErr("");
    const ok = await onSave(player.id, val, setErr);
    if (ok) setEditing(false);
  };
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4,flexWrap:"wrap"}}>
      <input style={{...S.input,width:70,padding:6}} value={val} onChange={e=>setVal(e.target.value)} type="number" min="1" max="99" />

      <button className="btn small" onClick={()=>setEditing(false)}>בטל</button>
      {err && <span style={{...S.errText,marginTop:0}}>{err}</span>}
    </div>
  );
}

  // רישום Service Worker בלבד — האפליקציה מכוונת בכוונה ל"הוספה למסך הבית" כקיצור
  // דרך פשוט (ר' manifest.json: display:"browser"), לא כהתקנת PWA מלאה, כדי לעקוף
  // לגמרי את בדיקת Google Play Protect שחוסמת חלק ממשתמשי אנדרואיד.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
</body>
</html>
